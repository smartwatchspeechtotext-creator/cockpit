    /* =====================================================================
       KOPIEREN WIE IM PROZEDERE-WERKZEUG
       =====================================================================
       Der Kopierknopf dort legt ZWEI Fassungen in die Zwischenablage:
       reinen Text und HTML mit gelb hinterlegten Platzhaltern. Beim
       Einfuegen in Word bleiben die Luecken damit sichtbar markiert.

       Diese Funktionen sind unveraendert von dort uebernommen, damit
       beide Wege dasselbe Ergebnis liefern - und damit eine spaetere
       Aenderung an den Regeln nur an einer Stelle gedacht werden muss.
       ===================================================================== */

    var ABBREVIATIONS = ['ggf', 'bzw', 'ca', 'u.a', 'z.b', 'etc', 'usw', 'evtl', 'inkl', 'insb', 'd.h', 'sog'];

    function tokenize(rawText) {
          const tokens = [];
          const regex = /\[\[([\s\S]*?)\]\]/g;
          let lastIndex = 0;
          let match;
    
          while ((match = regex.exec(rawText)) !== null) {
            const before = rawText.slice(lastIndex, match.index);
            const inner = match[1].trim();
            const anpassenMatch = inner.match(/^ANPASSEN\s*:?\s*/i);
    
            if (anpassenMatch) {
              // Echter Anpassen-Platzhalter: Präfix weg, Rest gelb
              if (before) tokens.push({ text: before, highlight: false });
              const content = inner.slice(anpassenMatch[0].length).trim();
              if (content) tokens.push({ text: content, highlight: true });
            } else if (istInterneAnweisung(inner)) {
              // Interne Anweisung: verwerfen, davorstehenden Satz markieren
              appendWithConditionalSentenceHighlight(tokens, before);
            } else {
              // Sonstiger Platzhalter (z. B. pharyngeale Symptome): gelb behalten
              if (before) tokens.push({ text: before, highlight: false });
              if (inner) tokens.push({ text: inner, highlight: true });
            }
    
            lastIndex = regex.lastIndex;
          }
    
          const tail = rawText.slice(lastIndex);
          if (tail) tokens.push({ text: tail, highlight: false });
    
          return expandUnderscoreBlanks(tokens);
        }

    function istInterneAnweisung(inner) {
          const s = inner.toLowerCase().trim();
    
          const anweisungsStarts = [
            'falls',
            'wenn',
            'diesen satz',
            'dieser satz',
            'immer direkt',
            'immer nach',
            'hier ',
            'bitte '
          ];
    
          return anweisungsStarts.some(function(start) {
            return s.indexOf(start) === 0;
          });
        }

    function appendWithConditionalSentenceHighlight(tokens, before) {
          if (!before) return;
    
          const splits = findSentenceSplits(before);
    
          if (splits.length === 0) {
            tokens.push({ text: before, highlight: true });
            return;
          }
    
          const splitPoint = splits[splits.length - 1];
          const earlierPlain = before.slice(0, splitPoint);
          const sentencePart = before.slice(splitPoint);
    
          if (earlierPlain) tokens.push({ text: earlierPlain, highlight: false });
          if (sentencePart.trim()) tokens.push({ text: sentencePart, highlight: true });
        }

    function findSentenceSplits(text) {
          const splits = [];
          const regex = /([.!?])(\s*)(?=[A-ZÄÖÜ])/g;
          let match;
    
          while ((match = regex.exec(text)) !== null) {
            const punctIndex = match.index;
            const beforePunct = text.slice(0, punctIndex);
            const wordMatch = beforePunct.match(/([A-Za-zÄÖÜäöüß]+)$/);
            const word = wordMatch ? wordMatch[1].toLowerCase() : '';
    
            if (ABBREVIATIONS.indexOf(word) === -1) {
              splits.push(punctIndex + 1);
            }
          }
    
          return splits;
        }

    function expandUnderscoreBlanks(tokens) {
          const result = [];
    
          tokens.forEach(function(token) {
            if (token.highlight) {
              result.push(token);
              return;
            }
    
            const parts = token.text.split(/(_{4,})/);
    
            parts.forEach(function(part) {
              if (part === '') return;
    
              if (/^_{4,}$/.test(part)) {
                result.push({ text: part, highlight: true });
              } else {
                result.push({ text: part, highlight: false });
              }
            });
          });
    
          return result;
        }

    function tokensToWordHtml(tokens) {
          const body = tokens.map(function(t) {
            const escaped = escapeHtml(t.text);
            return t.highlight
              ? '<span style="background:#fff3a3;">' + escaped + '</span>'
              : escaped;
          }).join('');
    
          return (
            '<!DOCTYPE html><html><head><meta charset="UTF-8"></head>' +
            '<body style="margin:0;padding:0;">' +
            '<div style="font-family:Arial,Helvetica,sans-serif;font-size:11pt;line-height:1.4;">' +
            body +
            '</div></body></html>'
          );
        }

    function escapeHtml(value) {
          return String(value || '')
            .replace(/&/g, '&amp;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;')
            .replace(/"/g, '&quot;')
            .replace(/'/g, '&#039;');
        }

    /*
     * Legt Text und formatierte Fassung gemeinsam ab. Kann der
     * Browser das nicht, bleibt es beim reinen Text - lieber ohne
     * Markierung als gar nicht.
     */
    function kopiereMitFormat_(roh, zurueckmeldung) {
      var tokens = tokenize(String(roh || ''));
      var klartext = tokens.map(function (x) { return x.text; }).join('');
      var alsHtml = tokensToWordHtml(tokens);

      function fertig() { if (zurueckmeldung) { zurueckmeldung(); } }

      if (navigator.clipboard &&
          typeof navigator.clipboard.write === 'function' &&
          typeof ClipboardItem !== 'undefined') {

        var stueck = new ClipboardItem({
          'text/plain': new Blob([klartext], { type: 'text/plain;charset=utf-8' }),
          'text/html': new Blob([alsHtml], { type: 'text/html;charset=utf-8' })
        });

        navigator.clipboard.write([stueck]).then(fertig).catch(function () {
          navigator.clipboard.writeText(klartext).then(fertig).catch(function () {});
        });
        return;
      }

      navigator.clipboard.writeText(klartext).then(fertig).catch(function () {});
    }

    /* =====================================================================
       BRIEF-SCHNELLWAHL
       ===================================================================== */

    var BRIEF_SYMBOL = {
      brief: '<svg viewBox="0 0 20 20" aria-hidden="true">' +
             '<rect x="2.5" y="4.5" width="15" height="11" rx="1.6"/>' +
             '<path d="m3 5.5 7 5 7-5"/></svg>',
      nachtrag: '<svg viewBox="0 0 20 20" aria-hidden="true">' +
             '<rect x="2.5" y="4.5" width="15" height="11" rx="1.6"/>' +
             '<path d="m3 5.5 7 5 7-5"/><path d="M14 14.5h4M16 12.5v4"/></svg>'
    };

    /*
     * Zeigt Brief und Nachtrag zur Auswahl, dazu die Vorlagen.
     * Vorausgewählt ist, was zum getippten Text passt - wer
     * "nachtrag" schreibt, sieht Nachtrag hervorgehoben.
     */
    function zeigeBriefAktionen_(ziel, rest) {
      var kasten = document.getElementById('treffer');
      var vorlagen = (suchDaten && suchDaten.briefVorlagen) || [];

      var art = ziel === 'nachtrag' ? 'nachtrag' : 'brief';
      var suchtext = suchform_(entferneVorlagenwort_(rest));

      /* Nach dem Getippten filtern, sonst alle zeigen. */
      var gefiltert = vorlagen.filter(function(name) {
        return !suchtext || suchform_(name).indexOf(suchtext) !== -1;
      });

      if (!gefiltert.length) { gefiltert = vorlagen; }

      function knopf(wert, beschriftung) {
        return '<button type="button" class="briefArt' +
          (wert === art ? ' passt' : '') + '" data-briefart="' + wert + '"' +
          ' title="' + esc(beschriftung) + ' jetzt auslösen">' +
          BRIEF_SYMBOL[wert] + esc(beschriftung) + '</button>';
      }

      kasten.classList.remove('werkzeugModus');
      kasten.innerHTML =
        '<div class="briefArten">' +
          knopf('brief', 'Brief') +
          knopf('nachtrag', 'Nachtrag') +
          (gefiltert.length
            ? '<button type="button" class="briefArt" data-vorlagenauf="1">' +
                '<svg viewBox="0 0 20 20" aria-hidden="true">' +
                  '<rect x="3" y="3" width="14" height="14" rx="2"/>' +
                  '<path d="M7 8h6M7 12h4"/></svg>Vorlage' +
              '</button>'
            : '') +
        '</div>' +
        '<div class="briefVorlagen" hidden>' +
          gefiltert.slice(0, 40).map(function(name) {
            return '<button type="button" class="briefVorlage" ' +
              'data-briefvorlage="' + esc(name).replace(/"/g, '&quot;') +
              '">' + esc(name) + '</button>';
          }).join('') +
        '</div>';

      kasten.hidden = false;

      /* Steht schon etwas Passendes im Text, sind die Vorlagen gleich
         offen - dann hat man sie ja gesucht. */
      if (suchtext) { vorlagenAufklappen_(); }

      /* Der Server weiß aus den Notizen, was gerade passt. */
      holeBriefVorschlag_();
    }

    /* Entfernt ein führendes "vorlage" oder "ambulanzbrief". */
    function entferneVorlagenwort_(text) {
      return String(text || '')
        .replace(/^\s*(vorlagen?|ambulanz\s*brief|ambulanzbrief)\b[\s:,;.\-]*/i, '')
        .trim();
    }

    function vorlagenAufklappen_() {
      var liste = document.querySelector('.briefVorlagen');
      var knopf = document.querySelector('[data-vorlagenauf]');
      if (!liste) { return; }

      liste.hidden = false;

      /* Nicht hervorheben - sonst sähe er aus wie eine gewählte Art
         und würde die Zuordnung durcheinanderbringen. */
      if (knopf) { knopf.setAttribute('aria-expanded', 'true'); }
    }

    /*
     * Fragt den Server, ob gerade Brief oder Nachtrag passt.
     *
     * Er leitet es aus denselben Daten ab wie der Brief-Automat:
     * Gibt es Notizen, die neuer sind als der letzte Brief, liegt
     * neuer Stoff vor. Sonst will man ergänzen.
     *
     * Nur beim Tippen eines Briefworts, serverseitig 20 Sekunden
     * zwischengespeichert - das kostet also nicht bei jedem Anschlag.
     */
    function holeBriefVorschlag_() {
      if (!ticket) { return; }

      google.script.run
        .withSuccessHandler(function(v) {
          if (!v || !v.vorschlag) { return; }

          var kasten = document.getElementById('treffer');
          var knoepfe = kasten.querySelectorAll('[data-briefart]');
          if (!knoepfe.length) { return; }

          knoepfe.forEach(function(k) {
            k.classList.toggle('passt', k.dataset.briefart === v.vorschlag);

            /* Kurz dazuschreiben, warum - das nimmt die Zweifel. */
            var alt = k.querySelector('small');
            if (alt) { alt.remove(); }

            if (k.dataset.briefart === v.vorschlag && v.grund) {
              var notiz = document.createElement('small');
              notiz.textContent = v.grund;
              k.appendChild(notiz);
            }
          });
        })
        .withFailureHandler(serverFehler_)
        .holeBriefVorschlag(ticket);
    }

    /* Welche Art gerade gewählt ist - für den Klick auf eine Vorlage. */
    function briefArtAusKasten_() {
      var aktiv = document.querySelector('.briefArt.passt[data-briefart]');
      return aktiv ? aktiv.dataset.briefart : 'brief';
    }

    function initUniversal_() {
      var feld = document.getElementById('universal');
      var hinweis = document.getElementById('suchfeldZiel');
      var kasten = document.getElementById('treffer');
      if (!feld) { return; }

      var senden = document.getElementById('suchfeldSenden');

      function aktualisiereKnopf_() {
        var text = feld.value.trim();
        var ziel = erkenneZiel_(feld.value);

        senden.classList.toggle('bereit', text.length > 0);
        senden.title = ziel
          ? 'Als ' + (ZIEL_TEXT[ziel] || 'Eintrag') + ' speichern'
          : 'Als Notiz speichern';
      }

      senden.addEventListener('click', speichereEingabe_);

      /* Höhe an den Inhalt anpassen - eine Zeile beim Suchen,
         mehr beim Schreiben. */
      function passeHoeheAn_() {
        feld.style.height = 'auto';
        feld.style.height = Math.min(feld.scrollHeight, 190) + 'px';
      }

      feld.addEventListener('input', function() {
        passeHoeheAn_();
        aktualisiereKnopf_();

        var text = feld.value;
        var ziel = erkenneZiel_(text);

        if (ziel) {
          hinweis.textContent = '⏎ ' + (ZIEL_TEXT[ziel] || 'Speichern');
          hinweis.className = 'suchfeldZiel speichern';
          hinweis.hidden = false;
          clearTimeout(suchTakt);

          /* Bei Brief, Nachtrag und Vorlage die Schnellwahl zeigen -
             sonst nichts, damit eine Aufgabe nicht mit Knöpfen
             zugestellt wird. */
          if (ziel === 'brief' || ziel === 'nachtrag' ||
              ziel === 'ambulanzbrief') {
            var w = erkenneRest_(text);
            zeigeBriefAktionen_(ziel === 'ambulanzbrief' ? 'brief' : ziel, w);
          } else {
            versteckeTreffer_();
          }

          return;
        }

        hinweis.hidden = true;
        hinweis.className = 'suchfeldZiel';

        var begriff = text.trim();
        letzteSuche = begriff;

        clearTimeout(suchTakt);

        if (begriff.length < 2) { versteckeTreffer_(); return; }

        /* Kein Warten mehr - die Suche laeuft hier. */
        suche_(begriff);
      });

      feld.addEventListener('keydown', function(ev) {
        /* Strg+Enter speichert immer - wie im Text-Fetcher. Damit
           lassen sich auch lange Notizen ohne Schlagwort ablegen. */
        if (ev.key === 'Enter' && (ev.ctrlKey || ev.metaKey)) {
          ev.preventDefault();
          speichereEingabe_();
          return;
        }

        if (ev.key === 'Enter' && !ev.shiftKey) {
          /* Mit Schlagwort speichert Enter. Ohne bleibt es ein
             Zeilenumbruch - sonst wäre eine mehrzeilige Notiz nicht
             einzugeben. */
          if (erkenneZiel_(feld.value)) {
            ev.preventDefault();
            speichereEingabe_();
          }
          return;
        }

        if (ev.key === 'Escape') {
          var kasten = document.getElementById('treffer');
          if (kasten.classList.contains('werkzeugModus')) {
            zurueckZuTreffern_();
            return;
          }
          versteckeTreffer_();
          feld.blur();
        }
      });

      /* Karte auf- und zuklappen, Inhalt kopieren. */
      kasten.addEventListener('click', function(ev) {
        var kopieren = ev.target.closest('[data-kopieren]');
        if (kopieren) {
          ev.stopPropagation();

          /* Was im Feld steht, gilt - auch wenn du es eben geändert
             hast. Nur wenn nichts aufgeklappt ist, kommt der
             ursprüngliche Baustein zum Zug. */
          var karteHier = kopieren.closest('.karte');
          var feldHier = karteHier && karteHier.querySelector('.karteInhalt');
          var zuKopieren = (feldHier && !feldHier.hidden)
            ? feldHier.innerText
            : kopieren.dataset.kopieren;

          kopiereMitFormat_(zuKopieren, function() {
            kopieren.textContent = 'Kopiert';
            window.setTimeout(function() {
              kopieren.textContent = 'Kopieren';
            }, 1400);
          });

          return;
        }

        /* Vorlagen zeigen. */
        var auf = ev.target.closest('[data-vorlagenauf]');
        if (auf) {
          ev.stopPropagation();
          vorlagenAufklappen_();
          return;
        }

        /* Brief oder Nachtrag antippen löst sofort aus - ohne
           Vorlage. Wer eine will, geht über "Vorlage". */
        var art = ev.target.closest('[data-briefart]');
        if (art) {
          ev.stopPropagation();
          versteckeTreffer_();

          var feldA = document.getElementById('universal');
          if (feldA) { feldA.value = ''; feldA.style.height = 'auto'; }

          var knopfA = document.getElementById('suchfeldSenden');
          if (knopfA) { knopfA.classList.remove('bereit'); }

          loeseBriefAus_(art.dataset.briefart);
          return;
        }

        /* Vorlage antippen löst sofort aus - mit der gewählten Art. */
        var bv = ev.target.closest('[data-briefvorlage]');
        if (bv) {
          ev.stopPropagation();

          /* Die Art kommt aus dem, was du getippt hast, sonst aus dem
             Vorschlag des Servers. */
          var gewaehlt = briefArtAusKasten_();

          versteckeTreffer_();

          var feldB = document.getElementById('universal');
          if (feldB) { feldB.value = ''; feldB.style.height = 'auto'; }

          var knopfB = document.getElementById('suchfeldSenden');
          if (knopfB) { knopfB.classList.remove('bereit'); }

          loeseBriefAus_(gewaehlt, bv.dataset.briefvorlage);
          return;
        }

        var vorlage = ev.target.closest('[data-vorlage]');
        if (vorlage) {
          ev.stopPropagation();
          versteckeTreffer_();
          loeseBriefAus_(vorlage.dataset.befehl || 'brief',
                         vorlage.dataset.vorlage);
          return;
        }

        var zurueck = ev.target.closest('[data-zurueck]');
        if (zurueck) {
          ev.stopPropagation();
          zurueckZuTreffern_();
          return;
        }

        var fenster = ev.target.closest('[data-fenster]');
        if (fenster) {
          ev.stopPropagation();
          oeffneWerkzeug_(Number(fenster.dataset.fenster),
                          fenster.dataset.begriff || '');
          return;
        }

        var oeffnen = ev.target.closest('[data-oeffnen]');
        if (oeffnen) {
          ev.stopPropagation();
          zeigeWerkzeugImFeld_(Number(oeffnen.dataset.oeffnen),
                               oeffnen.dataset.begriff || '',
                               oeffnen.dataset.kennung || '');
          return;
        }

        /* Klicks im bearbeitbaren Text und im Hinweis darunter
           gehören nicht zum Auf- und Zuklappen. Ohne diese Zeile
           schloss sich die Karte, sobald man hineinklickte. */
        if (ev.target.closest('.karteInhalt, .karteHinweis, .karteWerkzeuge')) {
          return;
        }

        var karte = ev.target.closest('.karte');
        if (!karte) { return; }

        var offen = karte.classList.toggle('aktiv');
        karte.querySelector('.karteInhalt').hidden = !offen;
        karte.querySelector('.karteWerkzeuge').hidden = !offen;

        var notiz = karte.querySelector('.karteHinweis');
        if (notiz) { notiz.hidden = !offen; }
      });

      document.addEventListener('click', function(ev) {
        if (!ev.target.closest('#suchfeld')) { versteckeTreffer_(); }
      });
    }

    /* =====================================================================
       ANWENDUNGEN EIN- UND AUSKLAPPEN
       =====================================================================
       Der Zustand liegt auf dem Server und gilt auf allen Geraeten.

       Zugeklappt ist die Voreinstellung - auch bevor der gespeicherte
       Zustand da ist. Wer nur kurz auf den Bildschirm sieht, erfaehrt
       damit nicht, welche Anwendungen es gibt.
       ===================================================================== */

    function setzeAnwendungen_(offen) {
      var bereich = document.getElementById('anwendungen');
      var schalter = document.getElementById('anwendungenSchalter');
      if (!bereich || !schalter) { return; }

      bereich.classList.toggle('zu', !offen);
      schalter.classList.toggle('zu', !offen);
      schalter.setAttribute('aria-expanded', offen ? 'true' : 'false');
    }

    function holeAnsicht_() {
      if (!ticket) { return; }

      google.script.run
        .withSuccessHandler(function(a) {
          setzeAnwendungen_(a && a.anwendungenOffen === true);
          setzeDock_(!a || a.dockOffen !== false, false);
        })
        .withFailureHandler(serverFehler_)
        .holeAnsicht(ticket);
    }

    function initAnwendungen_() {
      var schalter = document.getElementById('anwendungenSchalter');
      if (!schalter) { return; }

      schalter.addEventListener('click', function() {
        var bereich = document.getElementById('anwendungen');
        var offen = bereich.classList.contains('zu');   // wird jetzt geoeffnet

        setzeAnwendungen_(offen);

        if (!ticket) { return; }

        google.script.run
          .withSuccessHandler(function() {})
          .withFailureHandler(serverFehler_)
          .setzeAnsicht({
            anwendungenOffen: offen,
            dockOffen: dockOffen
          }, ticket);
      });
    }

    /* Fensterknöpfe auf- und zuklappen. */
    function initFenster_() {
      var huelle = document.getElementById('fensterMenue');
      var knopf = document.getElementById('fensterKnopf');
      if (!huelle || !knopf) { return; }

      function schliessen() {
        huelle.classList.remove('offen');
        knopf.setAttribute('aria-expanded', 'false');
      }

      knopf.addEventListener('click', function(ev) {
        ev.stopPropagation();
        var offen = !huelle.classList.contains('offen');
        huelle.classList.toggle('offen', offen);
        knopf.setAttribute('aria-expanded', offen ? 'true' : 'false');
      });

      /* Nach der Auswahl schließt es sich - man will danach ins
         Fenster, nicht ins Menü. */
      huelle.addEventListener('click', function(ev) {
        if (ev.target.closest('.layoutbtns button')) { schliessen(); }
      });

      document.addEventListener('click', function(ev) {
        if (!ev.target.closest('#fensterMenue')) { schliessen(); }
      });

      document.addEventListener('keydown', function(ev) {
        if (ev.key === 'Escape') { schliessen(); }
      });
    }


    /* =====================================================================
       VERLORENE FÄDEN
       =====================================================================
       Die Startseite nennt nur Anzahlen. Der Inhalt - also die Notizen
       selbst - kommt erst nach erneuter Kennworteingabe. Ein offenes
       Cockpit soll keine Diktate preisgeben.
       ===================================================================== */

    var faedenStand = null;
    var faedenTakt = null;

    function zeichneFaeden_(f) {
      var leiste = document.getElementById('faeden');
      var text = document.getElementById('faedenText');
      if (!leiste || !text) { return; }

      faedenStand = f;

      /* Der Kasten bleibt immer stehen - wie die Fällig-Box daneben.
         Ein Kasten, der mal da ist und mal nicht, ist unruhiger als
         einer, der ruhig meldet, dass nichts offen ist. */
      if (!f || !f.gesamt) {
        leiste.classList.add('an');
        leiste.classList.add('still');
        leiste.classList.remove('liegtWas');

        text.innerHTML =
          '<span class="faedenZeile leer">' +
            '<svg viewBox="0 0 20 20" aria-hidden="true">' +
              '<circle cx="10" cy="10" r="7"/><path d="m7 10 2 2 4-4"/>' +
            '</svg>Nichts offen</span>';

        setzePunkt_('faeden', '');
        return;
      }

      leiste.classList.remove('still');

      /* Eine Zeile je Art. Getönt ist, was seit gestern liegt -
         Frisches steht neutral darunter, damit es nicht mahnt. */
      function zeile(anzahl, beschriftung, liegt) {
        if (!anzahl) { return ''; }

        return '<span class="faedenZeile' + (liegt ? ' liegt' : '') + '">' +
          '<b>' + anzahl + '</b>' + esc(beschriftung) + '</span>';
      }

      var teile = [
        zeile(f.notizenAlt, 'Notizen alt', true),
        zeile(f.faelleAlt, 'Fälle ohne Frist', true),
        zeile(f.aufgabenAlt, 'Aufgaben ohne Frist', true),
        zeile(f.notizenNeu, 'Notizen neu', false),
        zeile(f.faelleNeu, 'Fälle neu', false),
        zeile(f.aufgabenNeu, 'Aufgaben neu', false)
      ].filter(Boolean);

      text.innerHTML = teile.join('');

      /* Der Punkt oben wird nur bernstein, wenn wirklich etwas
         liegengeblieben ist - nicht schon bei Frischem. */
      var liegtWas = !!(f.notizenAlt || f.faelleAlt || f.aufgabenAlt);
      leiste.classList.toggle('liegtWas', liegtWas);
      setzePunkt_('faeden', liegtWas ? 'liegt' : '');

      leiste.classList.add('an');
    }

    var faedenLetzteFrage = 0;
    var faedenLaeuft = false;

    function holeFaeden_() {
      if (!ticket) { return; }

      /* Zwei Abfragen gleichzeitig bringen nichts - die zweite
         bekäme ohnehin dieselbe Antwort. */
      if (faedenLaeuft) { return; }

      faedenLaeuft = true;
      faedenLetzteFrage = Date.now();

      google.script.run
        .withSuccessHandler(function(f) {
          faedenLaeuft = false;
          zeichneFaeden_(f);
        })
        .withFailureHandler(function(fehler) {
          faedenLaeuft = false;
          serverFehler_(fehler);
        })
        .holeFaeden(ticket);
    }

    /*
     * Bei jeder Bewegung nachsehen, höchstens alle sechs Sekunden.
     *
     * Der Takt allein reichte nicht: Eine Notiz, die woanders
     * entsteht - diktiert oder in der Eingabe-App getippt -, wurde
     * erst beim nächsten Durchlauf sichtbar. Jetzt genügt es, das
     * Cockpit anzufassen.
     */
    function holeFaedenBeiBewegung_() {
      if (!angemeldet || !ticket) { return; }
      if (Date.now() - faedenLetzteFrage < 6000) { return; }

      holeFaeden_();
    }

    function schliesseFaeden_() {
      document.getElementById('faedenTafel').classList.remove('an');
    }

    /*
     * Öffnet die Liste sofort - ohne Kennwort, aber auch ohne den
     * Wortlaut der Notizen. Datum, Alter und Herkunft reichen, um
     * aufzuräumen; wer den Inhalt lesen will, tippt das Kennwort.
     */
    function oeffneFaedenListe_() {
      var tafel = document.getElementById('faedenTafel');
      var koerper = document.getElementById('faedenKoerper');

      document.getElementById('faedenTitel').textContent = 'Verlorene Fäden';
      koerper.innerHTML = '<div class="faedenInhalt">' +
        '<div class="trefferLeer">Wird geladen …</div></div>';

      tafel.classList.add('an');

      google.script.run
        .withSuccessHandler(function(a) {
          if (!a || !a.ok) {
            koerper.innerHTML = '<div class="faedenInhalt">' +
              '<div class="trefferLeer">Konnte nicht geladen werden.</div></div>';
            return;
          }
          zeigeFaedenListe_(a, false);
        })
        .withFailureHandler(function() {
          koerper.innerHTML = '<div class="faedenInhalt">' +
            '<div class="trefferLeer">Konnte nicht geladen werden.</div></div>';
        })
        .holeFaedenListe(ticket);
    }

    /* Erst das Kennwort - dann die Inhalte. */
    function fragenachKennwort_() {
      var tafel = document.getElementById('faedenTafel');
      var koerper = document.getElementById('faedenKoerper');

      document.getElementById('faedenTitel').textContent = 'Verlorene Fäden';

      koerper.innerHTML =
        '<div class="faedenFrage">' +
          '<p>Die Notizen selbst sind erst nach dem Kennwort zu sehen.</p>' +
          '<input type="password" id="faedenWort" autocomplete="new-password" ' +
            'data-lpignore="true" placeholder="Kennwort">' +
          '<button type="button" id="faedenAuf">Anzeigen</button>' +
          '<div class="faedenFehler" id="faedenFehler"></div>' +
        '</div>';

      tafel.classList.add('an');

      var feld = document.getElementById('faedenWort');
      var knopf = document.getElementById('faedenAuf');

      function absenden() {
        var fehler = document.getElementById('faedenFehler');
        fehler.textContent = '…';
        knopf.disabled = true;

        google.script.run
          .withSuccessHandler(function(a) {
            knopf.disabled = false;

            if (!a || !a.ok) {
              fehler.textContent = (a && a.message) || 'Nicht korrekt.';
              feld.value = '';
              feld.focus();
              return;
            }

            zeigeFaedenListe_(a, true);
          })
          .withFailureHandler(function() {
            knopf.disabled = false;
            document.getElementById('faedenFehler').textContent = 'Fehler.';
          })
          .oeffneFaeden(feld.value, ticket);
      }

      knopf.addEventListener('click', absenden);
      feld.addEventListener('keydown', function(ev) {
        if (ev.key === 'Enter') { ev.preventDefault(); absenden(); }
      });

      window.setTimeout(function() { feld.focus(); }, 60);
    }

    function zeigeFaedenListe_(a, mitInhalt) {
      var koerper = document.getElementById('faedenKoerper');

      function gruppe(name, titel, liste, art) {
        if (!liste || !liste.length) { return ''; }

        return '<div class="faedenGruppe"><h4>' + esc(titel) + '</h4>' +
          liste.map(function(x) {
            var alter = x.tageAlt === 0 ? 'heute'
                      : (x.tageAlt === 1 ? 'gestern' : 'vor ' + x.tageAlt + ' Tagen');

            /*
             * Ohne Kennwort bleibt der Wortlaut verdeckt.
             *
             * Bei Fällen und Aufgaben sagt aber schon der Grund
             * alles: Sie stehen hier, WEIL keine Frist gesetzt ist.
             * Die Zeichenzahl wäre dort ohne Aussage - bei Notizen
             * verrät sie immerhin, ob es ein Satz oder ein ganzer
             * Befund ist.
             */
            var verdeckt = (art === 'Notiz')
              ? esc(art) + (x.laenge ? ' · ' + x.laenge + ' Zeichen' : '')
              : 'ohne Frist';

            var zeile = mitInhalt
              ? esc(x.text)
              : '<span class="fadenVerdeckt">' + verdeckt + '</span>';

            /* Von heute bleibt neutral - das ist noch kein Faden,
               nur ein offener Vorgang. Ab einem Tag getönt, ab einer
               Woche deutlich. */
            var stufe = x.tageAlt >= 7 ? ' sehrAlt'
                      : (x.tageAlt >= 1 ? ' alt' : ' frisch');

            /* Fälle und Aufgaben lassen sich hier gleich mit einer
               Frist versehen - dann sind sie kein loses Ende mehr,
               ohne dass du in die jeweilige App wechseln musst. */
            var frist = (art === 'Fall' || art === 'Aufgabe')
              ? '<input type="date" class="fadenFrist" ' +
                  'data-frist="' + esc(x.kennung) + '" ' +
                  'title="Frist setzen" aria-label="Frist setzen">'
              : '';

            return '<div class="faden' + stufe + '">' +
              '<span class="fadenText">' + zeile +
                '<span class="fadenZeit">' +
                  (x.datum ? esc(x.datum) + ' · ' : '') + esc(alter) +
                  (x.quelle ? ' · ' + esc(x.quelle) : '') +
                '</span>' +
              '</span>' +
              frist +
              '<button class="fadenWeg" type="button" data-faden="' +
                esc(x.kennung) + '">Ignorieren</button>' +
            '</div>';
          }).join('') +
        '</div>';
      }

      /* Ohne einen einzigen Brief gälte jede Notiz als verloren -
         dann stimmt etwas an der Einrichtung nicht. */
      var warnung = a.keineBriefe
        ? '<div class="faedenFrage" style="padding:12px 6px 0">' +
            '<p style="margin:0;color:#b42318">Im Briefe-Tab wurde ' +
            'nichts gefunden. Die Liste unten ist deshalb nicht ' +
            'aussagekräftig — bitte <code>pruefeFaeden</code> ' +
            'ausführen.</p></div>'
        : '';

      /* Knopf, um den Wortlaut nachzuladen. */
      var lesen = (!mitInhalt && (a.notizen.length || a.faelle.length ||
                                  a.aufgaben.length))
        ? '<button class="fadenLesen" type="button" id="fadenLesen">' +
            'Inhalt anzeigen' +
          '</button>'
        : '';

      koerper.innerHTML =
        '<div class="faedenInhalt">' +
          warnung + lesen +
          gruppe('notizen', 'Notizen ohne Abschluss', a.notizen, 'Notiz') +
          gruppe('faelle', 'Fälle ohne Frist', a.faelle, 'Fall') +
          gruppe('aufgaben', 'Aufgaben ohne Frist', a.aufgaben, 'Aufgabe') +
          (a.notizen.length || a.faelle.length || a.aufgaben.length
            ? ''
            : '<div class="trefferLeer">Nichts liegengeblieben.</div>') +
          (a.ausgeblendet
            ? '<button class="fadenZurueck" type="button" id="fadenZurueck">' +
                a.ausgeblendet + ' ausgeblendet · zurückholen' +
              '</button>'
            : '') +
        '</div>';

      var lesenKnopf = document.getElementById('fadenLesen');
      if (lesenKnopf) {
        lesenKnopf.addEventListener('click', fragenachKennwort_);
      }

      var zurueck = document.getElementById('fadenZurueck');
      if (zurueck) {
        zurueck.addEventListener('click', function() {
          zurueck.disabled = true;

          google.script.run
            .withSuccessHandler(function() {
              holeFaeden_();
              oeffneFaedenListe_();
            })
            .withFailureHandler(function(f) {
              zurueck.disabled = false;
              serverFehler_(f);
            })
            .holeAusgeblendeteZurueck(ticket);
        });
      }
    }

    /* Was überhaupt gesucht wird. */
    function zeigeFaedenEinstellung_() {
      var tafel = document.getElementById('faedenTafel');
      var koerper = document.getElementById('faedenKoerper');
      var e = (faedenStand && faedenStand.einstellung) ||
              { notizen: true, faelle: true, aufgaben: false };

      document.getElementById('faedenTitel').textContent = 'Worauf achten?';

      function schalter(feld, titel, hinweis, an) {
        return '<label class="faedenSchalter">' +
          '<input type="checkbox" data-faden-einst="' + feld + '"' +
            (an ? ' checked' : '') + '>' +
          '<span>' + esc(titel) + '<small>' + esc(hinweis) + '</small></span>' +
        '</label>';
      }

      koerper.innerHTML =
        '<div class="faedenInhalt">' +
          schalter('notizen', 'Notizen ohne Abschluss',
            'Diktiert oder getippt, aber nie ein Brief daraus geworden',
            e.notizen) +
          schalter('faelle', 'Fälle ohne Frist',
            'Steht in der Patientenliste, aber niemand erinnert daran',
            e.faelle) +
          schalter('aufgaben', 'Aufgaben ohne Frist',
            'Standardmäßig aus - die meisten Aufgaben brauchen keine',
            e.aufgaben) +
        '</div>';

      tafel.classList.add('an');
    }

    function initFaeden_() {
      var leiste = document.getElementById('faeden');
      var rad = document.getElementById('faedenRad');
      var zu = document.getElementById('faedenZu');
      var tafel = document.getElementById('faedenTafel');
      if (!leiste) { return; }

      leiste.addEventListener('click', function(ev) {
        /* Zahnrad und Überschrift haben eigene Aufgaben. */
        if (ev.target.closest('#faedenRad')) { return; }
        if (ev.target.closest('#faedenTitelText')) { return; }
        if (ev.target.closest('#faedenKlapp')) { return; }
        oeffneFaedenListe_();
      });

      leiste.addEventListener('keydown', function(ev) {
        if (ev.key === 'Enter' || ev.key === ' ') {
          ev.preventDefault();
          oeffneFaedenListe_();
        }
      });

      if (rad) {
        rad.addEventListener('click', function(ev) {
          ev.stopPropagation();
          zeigeFaedenEinstellung_();
        });
      }

      if (zu) { zu.addEventListener('click', schliesseFaeden_); }

      /* Zuhörer EINMAL am Rahmen, nicht bei jedem Öffnen neu.
         Sonst sammeln sie sich an, und ein Klick löst nach dem
         fünften Öffnen fünf Aufrufe aus. */
      var koerper = document.getElementById('faedenKoerper');

      if (koerper) {
        koerper.addEventListener('click', function(ev) {
          if (ev.target.closest('[data-frist]')) {
            ev.stopPropagation();
            return;
          }

          var weg = ev.target.closest('[data-faden]');
          if (!weg) { return; }

          var zeile = weg.closest('.faden');
          if (zeile) { zeile.style.display = 'none'; }

          google.script.run
            .withSuccessHandler(function() { holeFaeden_(); })
            .withFailureHandler(serverFehler_)
            .ignoriereFaden(weg.dataset.faden, ticket, false);
        });

        koerper.addEventListener('change', function(ev) {
          /* Frist gesetzt - der Eintrag verschwindet, sobald der
             Server bestätigt hat. */
          var frist = ev.target.closest('[data-frist]');

          if (frist) {
            var zeile = frist.closest('.faden');
            frist.disabled = true;

            google.script.run
              .withSuccessHandler(function(a) {
                frist.disabled = false;

                if (!a || !a.ok) {
                  frist.classList.remove('gesetzt');
                  return;
                }

                frist.classList.add('gesetzt');
                if (zeile) { zeile.style.display = 'none'; }
                holeFaeden_();
              })
              .withFailureHandler(function(f) {
                frist.disabled = false;
                serverFehler_(f);
              })
              .setzeFadenFrist(frist.dataset.frist, frist.value, ticket);

            return;
          }

          var kaestchen = ev.target.closest('[data-faden-einst]');
          if (!kaestchen) { return; }

          var neu = {};
          koerper.querySelectorAll('[data-faden-einst]').forEach(function(k) {
            neu[k.dataset.fadenEinst] = k.checked;
          });

          google.script.run
            .withSuccessHandler(function() { holeFaeden_(); })
            .withFailureHandler(serverFehler_)
            .setzeFadenEinstellung(neu, ticket);
        });
      }

      if (tafel) {
        tafel.addEventListener('click', function(ev) {
          if (ev.target === tafel) { schliesseFaeden_(); }
        });
      }

      document.addEventListener('keydown', function(ev) {
        if (ev.key === 'Escape') { schliesseFaeden_(); }
      });
    }

    function starteFaeden_() {
      holeFaeden_();
      clearInterval(faedenTakt);

      /* Grundtakt für den Fall, dass niemand etwas anfasst.
         Ansonsten fragt jede Bewegung nach - siehe
         holeFaedenBeiBewegung_. */
      faedenTakt = setInterval(holeFaeden_, 20000);
    }

    /* =====================================================================
       EINKLAPPEN
       =====================================================================
       Der Zustand liegt auf dem Server und gilt auf allen Geräten -
       wie bei den Anwendungen. Anders als dort starten beide Kästen
       offen: Was hier steht, soll man sehen.
       ===================================================================== */

    /* =====================================================================
       EINKLAPPEN
       =====================================================================
       Beide Kästen zusammen, hinter einem Symbol. Der Griff ist die
       Kopfzeile - egal welche der beiden.

       Ein gemeinsamer Zustand statt zweier: Zwei Symbole nebeneinander
       waren unruhiger als die Kästen selbst, und das Einklappen des
       einzelnen scheiterte an der Höhenangleichung der Reihe.
       ===================================================================== */

    var dockOffen = true;

    function setzeDock_(offen, merken) {
      dockOffen = offen;

      var dock = document.querySelector('.faelligDock');
      if (dock) { dock.classList.toggle('zu', !offen); }

      /* Die Knöpfe in den Kopfzeilen sagen, was als Nächstes kommt. */
      ['faelligKlapp', 'faedenKlapp'].forEach(function(id) {
        var k = document.getElementById(id);
        if (!k) { return; }
        k.title = 'Einklappen';
        k.setAttribute('aria-label', 'Einklappen');
      });

      if (!merken || !ticket) { return; }

      /* Ohne Prüfung würde ein fehlendes Element hier einen Fehler
         werfen - und der Klick bliebe halb erledigt. */
      var bereich = document.getElementById('anwendungen');

      google.script.run
        .withSuccessHandler(function() {})
        .withFailureHandler(serverFehler_)
        .setzeAnsicht({
          anwendungenOffen: bereich ? !bereich.classList.contains('zu') : false,
          dockOffen: offen
        }, ticket);
    }

    /* Punkt am Symbol - Rot geht vor Bernstein, damit Überfälliges
       nicht hinter Liegengebliebenem verschwindet. */
    var punktFaellig = '';
    var punktFaeden = '';

    function setzePunkt_(welche, art) {
      if (welche === 'faellig') { punktFaellig = art || ''; }
      else { punktFaeden = art || ''; }

      var punkt = document.getElementById('dockPunkt');
      if (!punkt) { return; }

      var stufe = punktFaellig === 'spaet' ? 'spaet'
                : ((punktFaellig || punktFaeden) ? 'heute' : '');

      punkt.className = 'dockPunkt' + (stufe ? ' an ' + stufe : '');
    }

    function initKlappen_() {
      /* Beide Kopfzeilen klappen ein - ausgenommen die Zahnräder. */
      ['faelligKopf', 'faedenTitelZeile'].forEach(function(klasse) {
        var kopf = document.querySelector('.' + klasse);
        if (!kopf) { return; }

        kopf.addEventListener('click', function(ev) {
          if (ev.target.closest('.faelligEinstellung, #faedenRad')) { return; }
          ev.stopPropagation();
          setzeDock_(false, true);
        });
      });

      ['faelligTitel', 'faedenTitelText'].forEach(function(id) {
        var griff = document.getElementById(id);
        if (!griff) { return; }

        griff.addEventListener('keydown', function(ev) {
          if (ev.key === 'Enter' || ev.key === ' ') {
            ev.preventDefault();
            ev.stopPropagation();
            setzeDock_(false, true);
          }
        });
      });

      var symbol = document.getElementById('dockSymbol');
      if (symbol) {
        symbol.addEventListener('click', function(ev) {
          ev.stopPropagation();
          setzeDock_(true, true);
        });
      }
    }

    function initFaellig_() {
      var knopf = document.getElementById('faelligTageKnopf');
      var menu = document.getElementById('faelligTageMenu');
      if (!knopf || !menu) { return; }

      zeichneTageMenu_();

      knopf.addEventListener('click', function(ev) {
        ev.stopPropagation();
        var oeffnen = menu.hidden;
        zeichneTageMenu_();
        menu.hidden = !oeffnen;
        knopf.setAttribute('aria-expanded', oeffnen ? 'true' : 'false');
      });

      menu.addEventListener('click', function(ev) {
        var ziel = ev.target.closest('[data-tage]');
        if (!ziel || !ticket) { return; }

        vorwarnAktuell = Number(ziel.dataset.tage);
        schliesseTageMenu_();

        google.script.run
          .withSuccessHandler(function() { holeFaellig_(); holeZahlen_(); })
          .withFailureHandler(serverFehler_)
          .setzeVorwarnung(vorwarnAktuell, ticket);
      });

      document.addEventListener('click', function(ev) {
        if (!ev.target.closest('.faelligEinstellung')) { schliesseTageMenu_(); }
      });

      document.addEventListener('keydown', function(ev) {
        if (ev.key === 'Escape') { schliesseTageMenu_(); }
      });

      var neu = document.getElementById('aktualisieren');
      if (neu) { neu.addEventListener('click', aktualisiereAlles_); }
    }

    /*
     * Nur die Box - eigener, kurzer Weg. Sie ist das Einzige auf der
     * Startseite, das eine Handlung ausloesen kann, und soll deshalb
     * vor allem anderen da sein.
     */
    function holeFaellig_() {
      if (!ticket) { return; }

      google.script.run
        .withSuccessHandler(zeichneFaellig_)
        .withFailureHandler(serverFehler_)
        .holeFaellig(ticket);
    }

    /* Aktualisieren-Knopf: Zwischenspeicher weg, dann neu lesen. */
    function aktualisiereAlles_() {
      if (!ticket) { return; }

      var knopf = document.getElementById('aktualisieren');
      if (knopf) { knopf.classList.add('laeuft'); }

      google.script.run
        .withSuccessHandler(function() {
          holeFaellig_();
          holeZahlen_();

          /* Erzwungener Abgleich: auch das Abgelegte verwerfen,
             damit wirklich alles frisch aus den Tabellen kommt. */
          loescheSuchdatenVomGeraet_();
          suchDaten = null;
          holeSuchdaten_();
          holeFaeden_();
          if (knopf) {
            setTimeout(function() { knopf.classList.remove('laeuft'); }, 600);
          }
        })
        .withFailureHandler(function() {
          if (knopf) { knopf.classList.remove('laeuft'); }
        })
        .aktualisiereJetzt(ticket);
    }

    function holeZahlen_() {
      if (!ticket) { return; }

      google.script.run
        .withSuccessHandler(function(zahlen) {
          zeichneZahlen_(zahlen);
        })
        .withFailureHandler(serverFehler_)
        .holeZahlen(ticket);
    }

    function starteZahlen_() {
      holeZahlen_();
      clearInterval(zahlenTakt);
      zahlenTakt = setInterval(function() {
        holeFaellig_();
        holeZahlen_();
      }, 60000);
    }

    function stoppeZahlen_() {
      clearInterval(zahlenTakt);
      zahlenTakt = null;
      zeichneZahlen_(null);

      var box = document.getElementById('faelligBox');
      if (box) {
        box.hidden = true;
        box.classList.remove('still', 'stufeHeute', 'stufeSpaet');
      }
    }

    /* ===== GEHEIME ANSICHTEN ===== */

    function oeffneSchlafAnsicht() {
      if (!angemeldet) { return; }
      openToolIndicesIntern([SCHLAF_TOOL_INDEX, NEUER_BRIEF_TOOL_INDEX], [90, 10], true);
    }

    /*
     * Briefansicht:
     * links Zuletzt 30 %, Mitte Eingabe 65 %, rechts Neu 5 %.
     * Nur hier ist das linke Pane (Zuletzt) einklappbar.
     */
    function oeffneBriefAnsicht() {
      if (!angemeldet) { return; }

      kombiAnsichtAktiv = true;

      openToolIndicesIntern(
        [ZULETZT_TOOL_INDEX, TEXT_FETCHER_TOOL_INDEX, NEUER_BRIEF_TOOL_INDEX],
        [30, 64, 6],
        false
      );

      markiereEinklappbar(0);
      markiereSchmal(2);
    }

    /*
     * Gibt einem Fenster die minimale Ausdehnung. Sitzt es allein in
     * seiner Spalte, muss auch die Spalte schmal werden - sonst haelt
     * sie weiter ihren Anteil.
     */
    function markiereSchmal(paneIndex) {
      var panes = document.querySelectorAll('#work .pane');
      var pane = panes[paneIndex];
      if (!pane) { return; }

      pane.classList.add('slim');

      var spalte = pane.parentNode;
      if (spalte && spalte.classList.contains('spalte') &&
          spalte.querySelectorAll('.pane').length === 1) {
        spalte.classList.add('slim');
      }
    }

    /* Merkt sich, ob die Kombi-Ansicht aktiv ist. */
    var kombiAnsichtAktiv = false;

    /* Macht genau ein Pane einklappbar (Klapp-Button einblenden). */
    function markiereEinklappbar(paneIndex) {
      var panes = document.querySelectorAll('#work .pane');
      var pane = panes[paneIndex];
      if (!pane) { return; }

      pane.classList.add('collapsible');
      pane.dataset.collapsible = '1';
    }

    /*
     * Klappt ein Pane zu einer schmalen Leiste ein bzw. wieder auf.
     * Der iframe bleibt geladen, nur die Breite aendert sich.
     */
    function togglePaneCollapse(paneIndex) {
      var work = document.getElementById('work');
      var panes = work.querySelectorAll('.pane');
      var pane = panes[paneIndex];

      if (!pane || pane.dataset.collapsible !== '1') { return; }

      var eingeklappt = pane.classList.toggle('collapsed');
      var button = pane.querySelector('.collapsebtn');

      /* Sitzt das Fenster allein in seiner Spalte, klappt die Spalte
         mit ein - andernfalls bliebe deren Breite stehen. */
      var spalte = pane.parentNode;
      var spalteMit = spalte && spalte.classList.contains('spalte') &&
        spalte.querySelectorAll('.pane').length === 1 ? spalte : null;
      if (spalteMit) { spalteMit.classList.toggle('collapsed', eingeklappt); }

      if (eingeklappt) {
        /* Gemerkte Breite sichern, damit sie beim Ausklappen zurueckkommt. */
        pane.dataset.vorherFlex = pane.style.flex || '';
        pane.dataset.vorherWidth = pane.style.width || '';
        pane.style.flex = '';
        pane.style.width = '';

        if (spalteMit) {
          spalteMit.dataset.vorherFlex = spalteMit.style.flex || '';
          spalteMit.dataset.vorherWidth = spalteMit.style.width || '';
          spalteMit.style.flex = '';
          spalteMit.style.width = '';
        }

        if (button) {
          button.textContent = '\u203a';
          button.title = 'Ausklappen';
        }

        /* Nachbar-Panes fuellen den frei gewordenen Platz. */
        verteileRestflaeche(paneIndex);
      } else {
        if (pane.dataset.vorherFlex) {
          pane.style.flex = pane.dataset.vorherFlex;
        }
        if (pane.dataset.vorherWidth) {
          pane.style.width = pane.dataset.vorherWidth;
        }

        if (spalteMit) {
          spalteMit.style.flex = spalteMit.dataset.vorherFlex || '1 1 0';
          if (spalteMit.dataset.vorherWidth) {
            spalteMit.style.width = spalteMit.dataset.vorherWidth;
          }
        }

        if (button) {
          button.textContent = '\u2039';
          button.title = 'Einklappen';
        }
      }

      registriereAktivitaet();
    }

    /*
     * Laesst die uebrigen Panes den Platz einnehmen.
     * Feste Pixelbreiten (aus dem Ziehen) werden dafuer geloest.
     */
    /*
     * Laesst die uebrigen Spalten den frei gewordenen Platz einnehmen.
     * Gemerkte Anteile bleiben erhalten, damit das Eingabe-Fenster
     * seinen Loewenanteil behaelt.
     */
    function verteileRestflaeche(ausgenommenIndex) {
      var panes = document.querySelectorAll('#work .pane');
      var ausgenommenePane = panes[ausgenommenIndex] || null;

      spaltenListe().forEach(function(spalte) {
        if (ausgenommenePane && spalte.contains(ausgenommenePane)) { return; }
        if (spalte.classList.contains('collapsed')) { return; }

        var anteil = Number(spalte.dataset.anteil || 1);
        spalte.style.width = '';
        spalte.style.flex = anteil + ' ' + anteil + ' 0';
      });
    }

    /* ===== HILFSFUNKTIONEN ===== */

    function esc(s) {
      return String(s).replace(/[&<>"]/g, function(c) {
        return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c];
      });
    }

        return '<svg viewBox="0 0 28 28" aria-hidden="true">' +

      document.getElementById('tiles').innerHTML =
        MENU_ITEMS.map(function(item, index) {

                   '<span class="tileTop">' +

                     '<span class="tileArrow" aria-hidden="true">\u2192</span>' +

    function renderUtilityTiles() {
      document.getElementById('utilityTools').innerHTML =
        UTILITY_ITEMS.map(function(item, index) {
          return '<button class="utilityTile ' + esc(item.className) + '" ' +
                   'type="button" onclick="openUtilityItem(' + index + ')">' +
                   '<span class="utilityIcon">' + utilityIcon(item.icon) + '</span>' +
                   '<span class="utilityText">' +
                     '<span class="utilityName">' + esc(item.name) + '</span>' +
                     '<span class="utilityHint">' + esc(item.hint) + '</span>' +
                   '</span>' +
                 '</button>';
        }).join('');
