      },
      {
        name: 'Zuletzt',
        dropdownName: '',
        icon: '\u25F4',
        url: ''
      },
      {
        name: 'Aufgaben',
        dropdownName: 'Aufgaben',
        icon: '\u2713',
        url: ''
      },
      {
        name: 'Ablage',
        dropdownName: 'Ablage',
        icon: '\u21E9',
        url: ''
      },
      {
        name: 'Fallnummern',
        dropdownName: 'Fallnummern',
        icon: '\u0023',
        url: ''
      }
    ];

    /* Nur diese erscheinen als grosse Kacheln. */
    var MENU_ITEMS = [
      {
        name: 'Rp.',
        tag: 'Verordnung',
        description: 'Rezepte schnell und strukturiert erstellen.',
        icon: 'prescription',
        className: 'prescription',
        tools: [0]
      },
      {
        name: 'Text-Bausteine',
        tag: 'Dokumentation',
        description: 'Vorlagen und Formulierungen direkt im Zugriff.',
        icon: 'textblocks',
        className: 'textblocks',
        tools: [1]
      },
      {
        name: 'OPs',
        tag: 'Organisation',
        description: 'Operationen und Abl\u00e4ufe \u00fcbersichtlich verwalten.',
        icon: 'operations',
        className: 'operations',
        tools: [2]
      }
    ];

    /*
     * Diese Werkzeuge stehen bewusst getrennt von den drei Hauptkacheln
     * unten links in der Startansicht.
     */
    var UTILITY_ITEMS = [
      {
        name: 'Aufgaben',
        hint: 'To-do-Liste',
        icon: 'tasks',
        className: 'tasks',
        tools: [7]
      },
      {
        name: 'Fallnummern',
        hint: 'Nummern nachschlagen',
        icon: 'cases',
        className: 'cases',
        tools: [9]
      },
      {
        name: 'Ablage',
        hint: 'Smartphone-Interface',
        icon: 'archive',
        className: 'archive',
        tools: [8]
      }
    ];

    var SCHLAF_TOOL_INDEX = 3;
    var NEUER_BRIEF_TOOL_INDEX = 4;
    var TEXT_FETCHER_TOOL_INDEX = 5;
    var ZULETZT_TOOL_INDEX = 6;

    /* =====================================================================
       FENSTER-LAYOUTS SICHERN
       =====================================================================
       Es werden hoechstens drei Fensteraufteilungen gespeichert. Ein neuer
       Eintrag entsteht ausschliesslich ueber den Logout-Button mit Schloss.
       Normale Aenderungen, Inaktivitaet und die normale Abmeldung schreiben
       nicht in den Layout-Verlauf.
       ===================================================================== */

    var LAYOUT_HISTORIE_SPEICHER = 'cockpit_layout_history_v2';
    var ALTER_LAYOUT_SPEICHER = 'cockpit_layout_v1';
    var MAX_GESPEICHERTE_LAYOUTS = 10;

    /* =====================================================================
       AUSWEIS
       =====================================================================
       Die Anmeldung liefert nicht mehr nur ja oder nein, sondern einen
       signierten Ausweis. Ohne ihn gibt der Server weder die Adressen
       der Werkzeuge noch die Layouts noch die Zahlen heraus.

       Frueher standen die zehn Adressen im Quelltext dieser Seite. Wer
       sie laden konnte, hatte damit alle Schluessel - auch ohne Kennwort.
       Jetzt stehen sie in Code.gs, die nie an den Browser geht.
       ===================================================================== */

    /*
     * Der Ausweis liegt ausschliesslich im Arbeitsspeicher. Er wird
     * nirgends abgelegt - beim Neuladen, in einem neuen Tab und nach
     * dem Schliessen des Fensters ist er weg.
     *
     * Damit ist jedes Oeffnen des Cockpits eine neue Anmeldung. Das
     * ist bei Patientendaten die richtige Voreinstellung: ein
     * offener Rechner ist kein offener Zugang.
     */
    var ticket = '';

    /*
     * Zentrale Fehlerbehandlung für Serveraufrufe.
     *
     * Wirft der Server "ABGEMELDET", ist der Ausweis ungültig - etwa
     * weil jemand den Not-Aus betätigt hat. Vorher haben alle
     * Abfragen ihre Fehler stillschweigend verschluckt: Der Server
     * meldete brav ab, das andere Gerät zeigte trotzdem weiter das
     * Cockpit. Genau daran ist der Not-Aus gescheitert.
     *
     * Jetzt fällt jedes Gerät beim nächsten Handgriff zurück auf die
     * Anmeldung - spätestens nach einer Minute von selbst, weil die
     * Zähler in diesem Takt nachfragen.
     */
    /* =====================================================================
       ANMELDUNG VON DER HÜLLE
       =====================================================================
       Läuft das Cockpit in der Handy-App, kann die Hülle das Kennwort
       hinterlegt haben und schickt es hier herein. Dann entfällt die
       Eingabe auf dem Telefon.

       Der Weg geht bewusst NICHT über die Adresse: Ein Kennwort in
       einer URL landet in Protokollen. Eine Nachricht zwischen den
       Fenstern hinterlässt nichts.

       Ein fremder Absender gewinnt dadurch nichts - er müsste das
       Kennwort bereits kennen, und dann käme er ohnehin durch die
       Anmeldemaske.
       ===================================================================== */
    window.addEventListener('message', function(ev) {
      var d = ev && ev.data;
      if (!d || d.typ !== 'cockpit-anmeldung' || !d.passwort) { return; }
      if (angemeldet) { return; }

      var feld = document.getElementById('passwort');
      if (!feld) { return; }

      feld.value = String(d.passwort);
      anmelden();
    });

    function serverFehler_(fehler) {
      var text = (fehler && fehler.message) || String(fehler || '');

      if (text.indexOf('ABGEMELDET') !== -1) {
        ticket = '';
        sperreCockpit();
      }
    }

    /* Die Layouts liegen jetzt auf dem Server. Hier steht nur die
       Arbeitskopie, die beim Anmelden gefuellt wird. */
    var layoutCache = [];

    function adressenEinsetzen_(adressen) {
      if (!Array.isArray(adressen)) { return; }
      adressen.forEach(function(adresse, i) {
        if (adresse && TOOLS[i]) { TOOLS[i].url = adresse; }
      });
    }

    function layoutLesenAusDom_() {
      var work = document.getElementById('work');
      if (!work || work.style.display === 'none') { return null; }

      var spalten = Array.prototype.slice.call(work.children).filter(function(k) {
        return k.classList.contains('spalte');
      });
      if (!spalten.length) { return null; }

      var gesamtBreite = spalten.reduce(function(summe, spalte) {
        return summe + spalte.getBoundingClientRect().width;
      }, 0) || 1;

      return {
        kombi: kombiAnsichtAktiv,
        spalten: spalten.map(function(spalte) {
          var panes = Array.prototype.slice.call(spalte.children).filter(function(k) {
            return k.classList.contains('pane');
          });

          var gesamtHoehe = panes.reduce(function(summe, pane) {
            return summe + pane.getBoundingClientRect().height;
          }, 0) || 1;

          return {
            anteil: Math.max(2, Math.round(
              spalte.getBoundingClientRect().width / gesamtBreite * 100)),
            panes: panes.map(function(pane) {
              return {
                tool: pane.dataset.toolIndex === undefined
                  ? null
                  : Number(pane.dataset.toolIndex),
                anteil: Math.max(2, Math.round(
                  pane.getBoundingClientRect().height / gesamtHoehe * 100)),
                collapsed: pane.classList.contains('collapsed'),
                collapsible: pane.dataset.collapsible === '1',
                slim: pane.classList.contains('slim')
              };
            })
          };
        })
      };
    }

    function istLayoutZustandGueltig_(zustand) {
      var hatSpalten = Boolean(
        zustand &&
        Array.isArray(zustand.spalten) &&
        zustand.spalten.some(function(spalte) {
          return spalte &&
            Array.isArray(spalte.panes) &&
            spalte.panes.length > 0;
        })
      );

      var hatAltePanes = Boolean(
        zustand &&
        Array.isArray(zustand.panes) &&
        zustand.panes.length > 0
      );

      return hatSpalten || hatAltePanes;
    }

    function layoutHistorieLesen_() {
      return layoutCache.slice();
    }

    /* Schreibt die Liste in die Arbeitskopie und auf den Server. */
    function layoutHistorieSchreiben_(liste) {
      layoutCache = liste.slice(0, MAX_GESPEICHERTE_LAYOUTS);
      if (!ticket) { return; }

      google.script.run
        .withSuccessHandler(function() {})
        .withFailureHandler(serverFehler_)
        .speichereLayouts(layoutCache, ticket);
    }

    /* Einmaliger Umzug: was noch im Browser liegt, wandert hoch. */
    function alteLayoutsUebernehmen_() {
      try {
        var roh = localStorage.getItem(LAYOUT_HISTORIE_SPEICHER) ||
                  localStorage.getItem(ALTER_LAYOUT_SPEICHER);
        if (!roh) { return; }

        var alt = JSON.parse(roh);
        if (!Array.isArray(alt)) {
          alt = istLayoutZustandGueltig_(alt)
            ? [{ id: 'migriert-' + Date.now(), gespeichertAm: '', zustand: alt }]
            : [];
        }

        alt = alt.filter(function(eintrag) {
          return eintrag && istLayoutZustandGueltig_(eintrag.zustand);
        });

        if (alt.length) { layoutHistorieSchreiben_(alt); }

        localStorage.removeItem(LAYOUT_HISTORIE_SPEICHER);
        localStorage.removeItem(ALTER_LAYOUT_SPEICHER);
      } catch (ignoriert) {}
    }

    function layoutGespeichert_() {
      var historie = layoutHistorieLesen_();
      return historie.length ? historie[0].zustand : null;
    }

    function layoutInHistorieSpeichern_() {
      try {
        var zustand = layoutLesenAusDom_();
        if (!zustand) { return false; }

        var historie = layoutHistorieLesen_();
        historie.unshift({
          id: String(Date.now()) + '-' + Math.random().toString(36).slice(2, 8),
          gespeichertAm: new Date().toISOString(),
          zustand: zustand
        });

        layoutHistorieSchreiben_(historie);

        renderLayoutAuswahl_();
        return true;
      } catch (ignoriert) {
        return false;
      }
    }

    function anzahlFensterImLayout_(zustand) {
      if (zustand && Array.isArray(zustand.spalten)) {
        return zustand.spalten.reduce(function(summe, spalte) {
          return summe +
            (spalte && Array.isArray(spalte.panes) ? spalte.panes.length : 0);
        }, 0);
      }
      return zustand && Array.isArray(zustand.panes)
        ? zustand.panes.length
        : 0;
    }

    function layoutZeitText_(isoText) {
      if (!isoText) { return 'bisher'; }
      var zeit = new Date(isoText);
      if (isNaN(zeit.getTime())) { return 'gespeichert'; }

      return zeit.toLocaleString('de-DE', {
        day: '2-digit',
        month: '2-digit',
        hour: '2-digit',
        minute: '2-digit'
      });
    }

    function renderLayoutAuswahl_() {
      var huelle = document.getElementById('gespeicherteLayouts');
      var button = document.getElementById('layoutMenuButton');
      var menu = document.getElementById('layoutMenu');
      if (!huelle || !button || !menu) { return; }

      var historie = layoutHistorieLesen_();

      if (!historie.length) {
        huelle.classList.add('empty');
        button.disabled = true;
        button.setAttribute('aria-expanded', 'false');
        menu.innerHTML = '';
        menu.hidden = true;
        return;
      }

      huelle.classList.remove('empty');
      button.disabled = false;
      menu.innerHTML = historie.map(function(eintrag, index) {
          var fenster = anzahlFensterImLayout_(eintrag.zustand);
          var fensterText = fenster === 1 ? '1 Fenster' : fenster + ' Fenster';
          var id = esc(eintrag.id);

          return '<div class="layoutMenuRow" role="none">' +
                   '<button class="layoutMenuOpen" type="button" role="menuitem" ' +
                     'data-layout-open="' + id + '">' +
                     '<span class="layoutMenuNumber">' + (index + 1) + '</span>' +
                     '<span class="layoutMenuText">' +
                       '<strong>' + esc(layoutZeitText_(eintrag.gespeichertAm)) + '</strong>' +
                       '<small>' + esc(fensterText) + '</small>' +
                     '</span>' +
                   '</button>' +
                   '<button class="layoutMenuDelete" type="button" ' +
                     'data-layout-delete="' + id + '" ' +
                     'title="Layout l\u00f6schen" ' +
                     'aria-label="Layout ' + (index + 1) + ' l\u00f6schen">\u00d7</button>' +
                 '</div>';
        }).join('');
    }

    function toggleLayoutMenu_() {
      var button = document.getElementById('layoutMenuButton');
      var menu = document.getElementById('layoutMenu');
      if (!button || !menu || button.disabled) { return; }

      var oeffnen = menu.hidden;
      menu.hidden = !oeffnen;
      button.setAttribute('aria-expanded', oeffnen ? 'true' : 'false');
    }

    function layoutMenuSchliessen_() {
      var button = document.getElementById('layoutMenuButton');
      var menu = document.getElementById('layoutMenu');
      if (!button || !menu) { return; }

      menu.hidden = true;
      button.setAttribute('aria-expanded', 'false');
    }

    function initLayoutMenu_() {
      document.addEventListener('click', function(event) {
        var huelle = document.getElementById('gespeicherteLayouts');
        if (huelle && !huelle.contains(event.target)) {
          layoutMenuSchliessen_();
        }
      });

      document.addEventListener('keydown', function(event) {
        if (event.key === 'Escape') {
          layoutMenuSchliessen_();
        }
      });
    }

    function layoutMenuAktion_(event) {
      var loeschen = event.target.closest('[data-layout-delete]');
      if (loeschen) {
        gespeichertesLayoutLoeschen_(loeschen.dataset.layoutDelete);
        return;
      }

      var oeffnen = event.target.closest('[data-layout-open]');
      if (oeffnen) {
        gespeichertesLayoutWaehlen(oeffnen.dataset.layoutOpen);
      }
    }

    function gespeichertesLayoutLoeschen_(layoutId) {
      if (!layoutId) { return; }

      try {
        var historie = layoutHistorieLesen_().filter(function(eintrag) {
          return eintrag.id !== layoutId;
        });

        layoutHistorieSchreiben_(historie);
        renderLayoutAuswahl_();
      } catch (ignoriert) {}
    }

    function gespeichertesLayoutWaehlen(layoutId) {
      if (!layoutId) { return; }

      var historie = layoutHistorieLesen_();
      var eintrag = historie.find(function(kandidat) {
        return kandidat.id === layoutId;
      });

      layoutMenuSchliessen_();
      if (!eintrag) {
        renderLayoutAuswahl_();
        return;
      }

      beendeAktivesResize_(false);

      try {
        layoutWiederherstellen_(eintrag.zustand);
      } catch (fehler) {
        showStart();
      }
    }

    /* Baut die gespeicherte Fensteraufteilung wieder auf. */
    function layoutWiederherstellen_(zustand) {
      var work = document.getElementById('work');

      /* Aeltere Speicherstaende kannten nur eine Reihe. */
      var spaltenDaten = Array.isArray(zustand.spalten)
        ? zustand.spalten
        : (zustand.panes || []).map(function(eintrag) {
            return { anteil: eintrag.anteil, panes: [eintrag] };
          });

      if (!spaltenDaten.length) { showStart(); return; }

      document.getElementById('start').style.display = 'none';
      work.style.display = 'flex';
      work.innerHTML = '';

      var gezaehlt = 0;

      spaltenDaten.forEach(function(spalteDaten) {
        if (gezaehlt >= MAX_PANES) { return; }

        var spalte = neueSpalte(null);
        var anteil = Number(spalteDaten.anteil) || 1;
        spalte.style.flex = anteil + ' ' + anteil + ' 0';
        spalte.dataset.anteil = String(anteil);

        (spalteDaten.panes || []).forEach(function(paneDaten) {
          if (gezaehlt >= MAX_PANES) { return; }

          var pane = neuesPane(null);
          var paneAnteil = Number(paneDaten.anteil) || 1;
          pane.style.flex = paneAnteil + ' ' + paneAnteil + ' 0';
          pane.dataset.anteil = String(paneAnteil);
          spalte.appendChild(pane);
          gezaehlt++;
        });

        if (spalte.querySelector('.pane')) { work.appendChild(spalte); }
      });

      ordneResizer();
      kombiAnsichtAktiv = zustand.kombi === true;

      /* Werkzeuge, Klapp- und Schmal-Markierungen in Dokumentreihenfolge. */
      var panes = work.querySelectorAll('.pane');
      var selects = work.querySelectorAll('.pane select');
      var flach = [];

      spaltenDaten.forEach(function(spalteDaten) {
        (spalteDaten.panes || []).forEach(function(paneDaten) {
          flach.push(paneDaten);
        });
      });

      for (var i = 0; i < panes.length && i < flach.length; i++) {
        var daten = flach[i];

        if (daten.tool !== null && daten.tool !== undefined && TOOLS[daten.tool]) {
          setzeWerkzeug(selects[i], Number(daten.tool));
        }

        if (daten.collapsible) { markiereEinklappbar(i); }
        if (daten.slim) { markiereSchmal(i); }
      }

      /* Eingeklappte zuletzt, damit die Breiten vorher stehen. */
      for (var k = 0; k < panes.length && k < flach.length; k++) {
        if (flach[k].collapsed && panes[k].dataset.collapsible === '1') {
          togglePaneCollapse(k);
        }
      }

      setActive(work.querySelectorAll('.spalte').length);
      registriereAktivitaet();
    }

    /* Beim Seitenaufbau gelesener Zustand als zusaetzliche Absicherung. */
    var gemerktesLayout = null;

    function layoutBeimStartLesen_() {
      gemerktesLayout = layoutGespeichert_();
    }

    /* Nach dem Anmelden: gespeicherte Aufteilung oder Startseite. */
    function zeigeNachAnmeldung_() {
      renderLayoutAuswahl_();

      /* Die normale Abmeldung startet genau einmal in der Uebersicht.
         Gespeicherte Layouts bleiben erhalten und koennen gewaehlt werden. */
      var startErzwingen =
        sessionStorage.getItem(START_NACH_LOGIN_SPEICHER) === '1';
      sessionStorage.removeItem(START_NACH_LOGIN_SPEICHER);

      if (startErzwingen) {
        gemerktesLayout = null;
        showStart();
        return;
      }

      /* Immer noch einmal lesen: Beim Speichern und erneuten Anmelden im
         selben Seitendokument kann ein neuer Verlaufseintrag entstanden sein. */
      var zustand = layoutGespeichert_() || gemerktesLayout;
      gemerktesLayout = null;

      if (zustand) {
        try {
          layoutWiederherstellen_(zustand);
          return;
        } catch (fehler) {}
      }

      showStart();
    }

    /* ===== PASSWORT UND INAKTIVITAET ===== */

    /* Nach dieser Zeit ohne Handgriff wird abgemeldet. Der Ausweis
       liegt ohnehin nur im Arbeitsspeicher - hier geht es um das
       offene Fenster auf einem unbeaufsichtigten Rechner. */
    var INAKTIVITAET_MS = 20 * 60 * 1000;
    var START_NACH_LOGIN_SPEICHER = 'cockpit_start_nach_login';
    var inaktivTimer = null;
    var angemeldet = false;

    function anmelden() {
      var passwortFeld = document.getElementById('passwort');
      var fehler = document.getElementById('loginFehler');
      var loginButton = document.getElementById('loginButton');
      var eingabe = passwortFeld.value;

      if (!eingabe) {
        fehler.textContent = 'Eingabe fehlt.';
        passwortFeld.focus();
        return;
      }

      fehler.textContent = '\u2026';
      loginButton.disabled = true;

      google.script.run
        .withSuccessHandler(function(antwort) {
          loginButton.disabled = false;

          if (!antwort || !antwort.ok) {
            fehler.textContent = (antwort && antwort.message) || 'Nicht korrekt.';
            passwortFeld.value = '';
            passwortFeld.focus();
            return;
          }

          ticket = antwort.ticket || '';
          adressenEinsetzen_(antwort.adressen);

          angemeldet = true;
      document.body.classList.add('angemeldet');
          document.getElementById('login').style.display = 'none';
          document.getElementById('cockpit').style.display = 'flex';
          passwortFeld.value = '';
          fehler.textContent = '';

          starteInaktivitaetsTimer();
          ladeServerstand_();
        })
        .withFailureHandler(function() {
          loginButton.disabled = false;
          fehler.textContent = 'Fehler.';
        })
        .anmelden(eingabe);
    }

    /*
     * Holt nach der Anmeldung die Layouts und zeigt das Cockpit.
     * Erst danach stehen die gespeicherten Fensteraufteilungen bereit -
     * vorher waere die Auswahl leer.
     */
    function ladeServerstand_() {
      /* Reihenfolge nach Wichtigkeit: erst die Faellig-Box, dann die
         Zahlen auf den Kacheln, zuletzt die Layouts. */
      /* Erst das, was schon auf dem Gerät liegt - dann ist die Suche
         augenblicklich benutzbar. Der Server liefert parallel nach. */
      ladeSuchdatenVomGeraet_();

      holeAnsicht_();
      holeFaellig_();
      starteFaeden_();
      starteBrief_();
      holeSuchdaten_();
      starteZahlen_();

      google.script.run
        .withSuccessHandler(function(liste) {
          layoutCache = Array.isArray(liste) ? liste : [];
          if (!layoutCache.length) { alteLayoutsUebernehmen_(); }

          renderLayoutAuswahl_();
          zeigeNachAnmeldung_();
        })
        .withFailureHandler(function() {
          renderLayoutAuswahl_();
          zeigeNachAnmeldung_();
        })
        .holeLayouts(ticket);
    }

    function starteInaktivitaetsTimer() {
      clearTimeout(inaktivTimer);
      if (!angemeldet) { return; }

      inaktivTimer = setTimeout(function() {
        sperreCockpit(true);
      }, INAKTIVITAET_MS);
    }

    /* =====================================================================
       SITZUNG PRÜFEN
       =====================================================================
       Der Not-Aus wirkt nur, wenn ein Gerät auch merkt, dass sein
       Ausweis tot ist. Bisher fiel das erst beim nächsten
       Zähler-Abruf auf - bis zu einer Minute später, und beim reinen
       Tippen in der Suchleiste gar nicht, weil die im Browser läuft.

       Jetzt fragt jede Bewegung nach: Mausklick, Tastendruck,
       Scrollen, Rückkehr in den Tab. Gedrosselt auf einmal alle acht
       Sekunden, damit daraus keine Dauerlast wird.
       ===================================================================== */

    var SITZUNG_ABSTAND_MS = 8000;
    var letztePruefung = 0;

    function pruefeSitzungGedrosselt_(sofort) {
      if (!angemeldet || !ticket) { return; }

      var jetzt = Date.now();
      if (!sofort && jetzt - letztePruefung < SITZUNG_ABSTAND_MS) { return; }

      letztePruefung = jetzt;

      google.script.run
        .withSuccessHandler(function() {})
        .withFailureHandler(serverFehler_)
        .pruefeSitzung(ticket);
    }

    function registriereAktivitaet() {
      if (!angemeldet) { return; }

      starteInaktivitaetsTimer();
      pruefeSitzungGedrosselt_(false);
      holeFaedenBeiBewegung_();
    }

    function sperreCockpit(wegenInaktivitaet, fensterBehalten) {
      /* Nur der Schloss-Button legt einen neuen Verlaufseintrag an.
         Inaktivitaet und die normale Abmeldung veraendern ihn nicht. */
      var layoutGesichert = false;
      if (fensterBehalten) {
        sessionStorage.removeItem(START_NACH_LOGIN_SPEICHER);
        layoutGesichert = layoutInHistorieSpeichern_();
      } else if (!wegenInaktivitaet) {
        sessionStorage.setItem(START_NACH_LOGIN_SPEICHER, '1');
      }

      layoutMenuSchliessen_();
      beendeAktivesResize_(false);

      angemeldet = false;
      document.body.classList.remove('angemeldet');
      clearTimeout(inaktivTimer);
      inaktivTimer = null;

      stoppeZahlen_();
      setzeAnwendungen_(false);
      setzeNurSuche_(false);

      clearInterval(faedenTakt);
      faedenTakt = null;
      faedenStand = null;
      schliesseFaeden_();

      var fl = document.getElementById('faeden');
      if (fl) { fl.classList.remove('an'); }

      loescheSuchdatenVomGeraet_();
      suchDaten = null;
      suchDatenStand = 0;

      clearInterval(briefTakt);
      briefTakt = null;
      briefWachBis = 0;
      briefText = '';
      briefZeitpunkt = 0;
      briefGepulst = '';

      var puls = document.getElementById('briefPuls');
      if (puls) { puls.classList.remove('an'); }

      ticket = '';

      document.getElementById('work').innerHTML = '';
      document.getElementById('start').style.display = 'flex';
      document.getElementById('work').style.display = 'none';
      document.getElementById('cockpit').style.display = 'none';
      document.getElementById('login').style.display = 'flex';
      document.getElementById('passwort').value = '';
      document.getElementById('loginFehler').textContent =
        wegenInaktivitaet
          ? 'Erneute Eingabe erforderlich.'
          : (fensterBehalten
              ? (layoutGesichert
                  ? 'Layout gespeichert.'
                  : 'Fenster konnten nicht gespeichert werden.')
              : '');

      setActive(0);

      setTimeout(function() {
        document.getElementById('passwort').focus();
      }, 100);
    }

    ['mousedown','mousemove','keydown','scroll','touchstart','click',
     'input','focusin']
      .forEach(function(ereignis) {
        document.addEventListener(ereignis, registriereAktivitaet, { passive: true });
      });

    /* Zurück im Tab: ohne Drosselung prüfen. Wer das Fenster wieder
       hervorholt, soll nicht erst weiterarbeiten und dann abfliegen. */
    document.addEventListener('visibilitychange', function() {
      if (!document.hidden) {
        pruefeSitzungGedrosselt_(true);
        if (angemeldet) { holeFaeden_(); }
      }
    });

    window.addEventListener('focus', function() {
      pruefeSitzungGedrosselt_(true);
    });

    window.addEventListener('blur', function() {
      if (!angemeldet) { return; }
      setTimeout(function() {
        var aktivesElement = document.activeElement;
        if (aktivesElement && aktivesElement.tagName === 'IFRAME') {
          registriereAktivitaet();
        }
      }, 100);
    });

    /* =====================================================================
       ZAHLEN AUF DEN KACHELN
       =====================================================================
       Das Cockpit-Skript liest die beiden Tabellen direkt und zaehlt,
       was offen ist. Ohne Zahl bedeutet: keine Quelle hinterlegt oder
       Tabelle nicht lesbar - das bleibt stumm, statt eine Fehlermeldung
       ueber die Startseite zu legen.
       ===================================================================== */

    var ZAHLEN_ZUORDNUNG = { tasks: 'aufgaben', cases: 'faelle' };
    var zahlenTakt = null;

    function zeichneZahlen_(zahlen) {
      Object.keys(ZAHLEN_ZUORDNUNG).forEach(function(klasse) {
        var kachel = document.querySelector('.utilityTile.' + klasse);
        if (!kachel) { return; }

        var wert = zahlen ? zahlen[ZAHLEN_ZUORDNUNG[klasse]] : null;
        var zeichen = kachel.querySelector('.kachelZahl');

        if (!zeichen) {
          zeichen = document.createElement('span');
          zeichen.className = 'kachelZahl';
          kachel.appendChild(zeichen);
        }

        if (wert === null || wert === undefined) {
          /* Frueher verschwand der Zaehler hier wortlos. Jetzt steht
             ein Fragezeichen da, und der Grund haengt im Tooltip. */
          var grund = zahlen
            ? (klasse === 'tasks' ? zahlen.aufgabenFehler : zahlen.faelleFehler)
            : '';

          zeichen.textContent = '?';
          zeichen.className = 'kachelZahl unklar';
          zeichen.title = 'Zähler nicht lesbar' + (grund ? ': ' + grund : '');
        } else {
          zeichen.textContent = wert;
          zeichen.className = 'kachelZahl' + (Number(wert) === 0 ? ' leer' : '');
          zeichen.title = '';
        }

        zeichneWarnung_(kachel, klasse, zahlen);
      });
    }

    /*
     * Ueberfaellig schlaegt heute-faellig: es wird immer nur eine
     * Warnung gezeigt, damit die Kachel nicht zum Armaturenbrett wird.
     */
    function zeichneWarnung_(kachel, klasse, zahlen) {
      var spaet = 0;
      var heute = 0;

      if (zahlen && klasse === 'tasks') {
        spaet = Number(zahlen.aufgabenUeberfaellig) || 0;
        heute = Number(zahlen.aufgabenHeute) || 0;
      } else if (zahlen && klasse === 'cases') {
        spaet = Number(zahlen.faelleUeberfaellig) || 0;
        heute = Number(zahlen.faelleHeute) || 0;
      }

      var warnung = kachel.querySelector('.kachelWarnung');

      if (!spaet && !heute) {
        if (warnung) { warnung.remove(); }
        kachel.classList.remove('draengt');
        return;
      }

      if (!warnung) {
        warnung = document.createElement('span');
        warnung.className = 'kachelWarnung';
        kachel.appendChild(warnung);
      }

      var uhr = '<svg viewBox="0 0 24 24" aria-hidden="true">' +
                  '<circle cx="12" cy="12" r="9" fill="none"/>' +
                  '<path d="M12 7v5l3 2"/></svg>';

      if (spaet) {
        warnung.className = 'kachelWarnung';
        warnung.innerHTML = uhr + spaet;
        warnung.title = spaet === 1
          ? '1 Eintrag ist überfällig'
          : spaet + ' Einträge sind überfällig';
        kachel.classList.add('draengt');
      } else {
        warnung.className = 'kachelWarnung heute';
        warnung.innerHTML = uhr + heute;
        warnung.title = heute === 1
          ? '1 Eintrag ist heute fällig'
          : heute + ' Einträge sind heute fällig';
        kachel.classList.remove('draengt');
      }
    }

    /* =====================================================================
       FAELLIG-BOX
       =====================================================================
       Zeigt aus beiden Listen, was ansteht. Aus der Patiententabelle
       kommt nur der Notiztext - welcher Patient dahintersteht, verlaesst
       den Server nicht.
       ===================================================================== */

    function wannText_(eintrag) {
      if (eintrag.zustand === 'heute') { return 'heute'; }
      if (eintrag.zustand === 'morgen') { return 'morgen'; }

      if (eintrag.zustand === 'spaet') {
        var tage = Math.abs(eintrag.tage);
        return tage === 1 ? 'gestern' : tage + ' Tage';
      }

      return 'in ' + eintrag.tage + ' Tagen';
    }

    function zeichneFaellig_(daten) {
      var box = document.getElementById('faelligBox');
      var liste = document.getElementById('faelligListe');
      var fuss = document.getElementById('faelligFuss');
      if (!box) { return; }

      /* Die eingestellte Vorwarnzeit kommt vom Server und gilt auf
         allen Geraeten. Auch merken, wenn die Liste leer ist. */
      if (daten && typeof daten.tage === 'number') {
        vorwarnAktuell = daten.tage;
        zeichneTageMenu_();
      }

      var eintraege = (daten && daten.eintraege) || [];

      /* Nichts fällig: Die Box bleibt stehen, wird aber still. So ist
         das Zeitfenster jederzeit erreichbar, und der Blick dorthin
         beruhigt, statt ins Leere zu gehen. */
      if (!eintraege.length) {
        box.hidden = false;
        box.classList.remove('stufeHeute', 'stufeSpaet');
        box.classList.add('still');
        setzePunkt_('faellig', '');

        document.getElementById('faelligTitelText').textContent = 'Nichts fällig';

        var zeitraum = vorwarnAktuell === 0 ? 'für heute'
                     : (vorwarnAktuell === 1 ? 'bis morgen'
                     : 'in den nächsten ' + vorwarnAktuell + ' Tagen');

        liste.innerHTML =
          '<div class="faelligLeer">' +
            '<svg viewBox="0 0 20 20" aria-hidden="true">' +
              '<circle cx="10" cy="10" r="7"/><path d="m7 10 2 2 4-4"/>' +
            '</svg>' +
            'Nichts ' + esc(zeitraum) +
          '</div>';

        fuss.hidden = true;
        return;
      }

      box.classList.remove('still');

      /* Der dringlichste Eintrag bestimmt Ueberschrift und Farbe.
         Ueberfaellig schlaegt heute, heute schlaegt alles Spaetere. */
      var spaet = eintraege.some(function(e) { return e.zustand === 'spaet'; });
      var heute = eintraege.some(function(e) { return e.zustand === 'heute'; });

      document.getElementById('faelligTitelText').textContent =
        (spaet || heute) ? 'Fällig' : 'Bald fällig';

      /* Ohne heute Faelliges und ohne Ueberfaelliges keine Farbe. */
      box.classList.remove('stufeHeute', 'stufeSpaet');
      if (spaet) { box.classList.add('stufeSpaet'); }
      else if (heute) { box.classList.add('stufeHeute'); }

      setzePunkt_('faellig', spaet ? 'spaet' : (heute ? 'heute' : ''));

      liste.innerHTML = eintraege.map(function(e) {
        var symbol = utilityIcon(e.quelle === 'fall' ? 'cases' : 'tasks');
        var herkunft = e.quelle === 'fall' ? 'Fallnummern' : 'Aufgaben';

        return '<div class="faelligZeile ' + esc(e.zustand) + '">' +
                 '<span class="faelligMarke" aria-hidden="true"></span>' +
                 '<span class="faelligQuelle" title="' + herkunft + '">' +
                   symbol +
                 '</span>' +
                 '<span class="faelligText" title="' + esc(e.text) + '">' +
                   esc(e.text) +
                 '</span>' +
                 '<span class="faelligWann">' + esc(wannText_(e)) + '</span>' +
               '</div>';
      }).join('');

      if (daten.weitere) {
        fuss.textContent = '+ ' + daten.weitere +
          (daten.weitere === 1 ? ' weiterer Eintrag' : ' weitere Einträge');
        fuss.hidden = false;
      } else {
        fuss.hidden = true;
      }

      box.hidden = false;
    }

    var VORWARN_STUFEN = [
      { wert: 0,  text: 'nur heute' },
      { wert: 1,  text: '1 Tag im Voraus' },
      { wert: 2,  text: '2 Tage im Voraus' },
      { wert: 3,  text: '3 Tage im Voraus' },
      { wert: 7,  text: '1 Woche im Voraus' },
      { wert: 14, text: '2 Wochen im Voraus' }
    ];

    var vorwarnAktuell = 2;

    function zeichneTageMenu_() {
      var menu = document.getElementById('faelligTageMenu');
      if (!menu) { return; }

      menu.innerHTML = VORWARN_STUFEN.map(function(s) {
        return '<button type="button" role="menuitem" data-tage="' + s.wert +
               '" aria-current="' + (s.wert === vorwarnAktuell) + '">' +
               esc(s.text) + '</button>';
      }).join('');
    }

    function schliesseTageMenu_() {
      var menu = document.getElementById('faelligTageMenu');
      var knopf = document.getElementById('faelligTageKnopf');
      if (!menu || !knopf) { return; }

      menu.hidden = true;
      knopf.setAttribute('aria-expanded', 'false');
    }


    /* =====================================================================
       UNIVERSALFELD
       =====================================================================
       Ohne Schlagwort wird gesucht, mit Schlagwort gespeichert.

       Gesucht wird waehrend des Tippens. Damit das nicht bei jedem
       Buchstaben zum Server geht, wartet es 140 ms - lange genug, um
       Tastenanschlaege zusammenzufassen, kurz genug, um sofort zu
       wirken. Die Rohdaten liegen serverseitig im Zwischenspeicher.
       ===================================================================== */

    /* =====================================================================
       BRIEF-AUTOMAT
       =====================================================================
       "brief", "nachtrag" und "wahl" muessen nach dem Speichern noch
       ausgeloest werden. Das Skript kann das nicht - externe Aufrufe
       brauchen eine Berechtigung, die sich in diesen Projekten nicht
       erteilen liess. Deshalb ruft der Browser die Adresse auf, genau
       wie in der Eingabe-App.

       Ohne diesen Teil speicherte die Cockpit-Leiste zwar brav, loeste
       aber nichts aus - "brief" tat schlicht nichts.
       ===================================================================== */

    var BRIEF_AUTOMAT_URL = 'https://script.google.com/macros/s/AKfycbxrS-7cOONNAwbwO6ehkE0M1VsqDmvqDtEavIqj3VG-B40l6TFWuLKt0ZyWFZXlWzTx/exec';
    var BRIEF_AUTOMAT_TOKEN = 'hno-brief-2026';

    function loeseBriefAus_(befehl, vorlage) {
      var hinweis = document.getElementById('suchfeldZiel');

      /*
       * Der Wortlaut ist bewusst kurz und nichtssagend. Wer über die
       * Schulter schaut, soll aus der Zeile nicht schließen können,
       * was hier gerade passiert - und nach zehn Sekunden ist sie
       * ohnehin wieder leer.
       */
      function melde(text) {
        if (!hinweis) { return; }
        hinweis.textContent = text;
        hinweis.className = 'suchfeldZiel speichern';
        hinweis.hidden = false;
        window.setTimeout(function() { hinweis.hidden = true; }, 10000);
      }

      if (!BRIEF_AUTOMAT_URL || BRIEF_AUTOMAT_URL.indexOf('http') !== 0) {
        melde('Ziel fehlt');
        return;
      }

      var trenner = BRIEF_AUTOMAT_URL.indexOf('?') === -1 ? '?' : '&';
      var adresse = BRIEF_AUTOMAT_URL + trenner +
        'action=' + encodeURIComponent(befehl) +
        '&token=' + encodeURIComponent(BRIEF_AUTOMAT_TOKEN);

      if (vorlage) { adresse += '&vorlage=' + encodeURIComponent(vorlage); }

      melde('läuft …');

      /* Der Prüf-Link zeigt dieselbe Adresse in einem eigenen Tab.
         Dort ist die Antwort lesbar - hier nicht, weil der Browser
         sie bei fremder Herkunft verbirgt. */
      var pruefBereich = document.getElementById('pruefen');
      var pruefLink = document.getElementById('pruefLink');

      if (pruefBereich && pruefLink) {
        pruefLink.href = adresse;
        pruefBereich.hidden = false;

        window.setTimeout(function() { pruefBereich.hidden = true; }, 10000);
      }

      function fertig() {
        /* Gesendet heißt nicht fertig - das meldet erst der grüne
           Puls. Deshalb nur ein Haken, kein Versprechen. */
        melde('✓');
      }

      /* Ab jetzt häufig nachsehen - der Brief kann in Sekunden da
         sein, und der Puls soll nicht hinterherhinken. */
      briefErwarten_();

      /* Ein Brief schließt in der Regel offene Notizen. Nach ein
         paar Sekunden nachsehen, damit die Zahl nicht länger steht
         als nötig. */
      [4000, 12000, 30000].forEach(function(nach) {
        window.setTimeout(holeFaeden_, nach);
      });

      fetch(adresse, { mode: 'no-cors', cache: 'no-store' })
        .then(fertig)
        .catch(function() {
          /* Zweiter Versuch: manche Sandkasten-Umgebungen blockieren
             fetch. Ein Bildaufruf loest dieselbe Adresse aus. */
          var bild = new Image();
          bild.onload = bild.onerror = fertig;
          bild.src = adresse + '&v=' + Date.now();
        });
    }

    var ZIEL_TEXT = {
      aufgabe:       'Aufgabe',
      erinnerung:    'Erinnerung',
      fall:          'Patientenliste',
      ambulanzbrief: 'Ambulanzbrief',
      brief:         'Brief',
      nachtrag:      'Nachtrag',
      wahl:          'Wahl',
      memo:          'Notiz'
    };

    var SCHLAGWORTE = [
      'todo', 'to-do', 'to do', 'tudu', 'tu du', 'aufgabe',
      'reminder', 'erinnerung', 'erinnere',
      'fallnummer', 'fallnr', 'fall-nr', 'fall nr', 'fallakte', 'geburtsdatum',
      'ambulanzbrief', 'ambulanz brief', 'vorlage', 'vorlagen',
      'brief', 'briefe', 'nachtrag', 'nachtragen', 'ergänzung',
      'wahl', 'memo', 'doku', 'dokumentation'
    ];

    var suchTakt = null;
    var letzteSuche = '';
    var trefferDaten = null;

    /* Erkennt das Schlagwort im Browser, damit der Hinweis ohne
       Serverweg erscheint - der Server entscheidet beim Speichern
       ohnehin noch einmal selbst. */
    function erkenneZiel_(text) {
      var klein = String(text || '').toLowerCase().trim();

      for (var i = 0; i < SCHLAGWORTE.length; i++) {
        var w = SCHLAGWORTE[i];
        if (klein.indexOf(w) !== 0) { continue; }

        var danach = klein.charAt(w.length);
        if (danach && ' :,;.-'.indexOf(danach) === -1) { continue; }

        if (w === 'vorlage' || w === 'vorlagen' ||
            w.indexOf('ambulanz') === 0) { return 'ambulanzbrief'; }
        if (['todo','to-do','to do','tudu','tu du','aufgabe'].indexOf(w) >= 0) {
          return 'aufgabe';
        }
        if (['reminder','erinnerung','erinnere'].indexOf(w) >= 0) {
          return 'erinnerung';
        }
        if (w.indexOf('fall') === 0 || w === 'geburtsdatum') { return 'fall'; }
        if (w.indexOf('nachtrag') === 0 || w === 'ergänzung') { return 'nachtrag'; }
        if (w === 'wahl') { return 'wahl'; }
        if (w.indexOf('brief') === 0) { return 'brief'; }
        return 'memo';
      }

      return null;
    }

    /* Was nach dem Schlagwort steht - daraus wird die Vorlage
       gefiltert. */
    function erkenneRest_(text) {
      var klein = String(text || '').toLowerCase().trim();

      for (var i = 0; i < SCHLAGWORTE.length; i++) {
        var w = SCHLAGWORTE[i];
        if (klein.indexOf(w) !== 0) { continue; }

        var danach = klein.charAt(w.length);
        if (danach && ' :,;.-'.indexOf(danach) === -1) { continue; }

        return String(text).slice(w.length).replace(/^[\s:,;.\-]+/, '');
      }

      return '';
    }

    function versteckeTreffer_() {
      var kasten = document.getElementById('treffer');
      kasten.hidden = true;
      kasten.classList.remove('werkzeugModus');
    }

    /*
     * Hebt Platzhalter hervor - nach denselben Regeln wie die
     * Werkzeuge. tokenize kennt sie bereits; hier wird nur das
     * Ergebnis in Markierungen umgesetzt.
     */
    function hebeHervor_(roh) {
      var tokens = tokenize(String(roh || ''));

      return tokens.map(function(x) {
        var text = esc(x.text);
        return x.highlight ? '<mark>' + text + '</mark>' : text;
      }).join('');
    }

    function karteHtml_(gruppe, e, index) {
      var kennung = gruppe + '-' + index;
      var kopf, zeile, inhalt;

      if (gruppe === 'rezepte') {
        kopf = '<span class="karteTitel">' + esc(e.titel) + '</span>';

        /* Ohne Hinweis der Anfang des Rezepttextes - sonst sehen
           mehrere Varianten desselben Medikaments identisch aus. */
        var untertitel = e.hinweis ||
          String(e.text || '').replace(/\s+/g, ' ').slice(0, 72);

        zeile = untertitel
          ? '<div class="karteZeile">' + esc(untertitel) + '</div>' : '';
        inhalt = e.text;
      } else if (gruppe === 'codes') {
        kopf = '<span class="karteTitel">' + esc(e.titel) + '</span>' +
               (e.ops ? '<span class="karteCode">' + esc(e.ops) + '</span>' : '') +
               (e.icd ? '<span class="karteCode zweit">' + esc(e.icd) + '</span>' : '');
        zeile = '<div class="karteZeile">' + esc(e.kategorie) +
                (e.hinweis ? ' · ' + esc(e.hinweis) : '') +
                (e.vorlagen ? ' · Teil von ' + esc(e.vorlagen) : '') +
                '</div>';

        /* Amtliche Bezeichnungen, unverändert aus deiner Tabelle. */
        var amt = [];

        if (e.ops) {
          amt.push('<div><b>' + esc(e.ops) + '</b><span>' +
            esc(e.opsText || '—') + '</span></div>');
        }

        if (e.icdText) {
          e.icdText.split('\n').forEach(function(zeileIcd) {
            var teil = zeileIcd.split(/\s{2,}/);
            amt.push('<div><b>' + esc(teil[0] || '') + '</b><span>' +
              esc(teil.slice(1).join(' ')) + '</span></div>');
          });
        } else if (e.icd) {
          amt.push('<div><b>' + esc(e.icd) + '</b><span>—</span></div>');
        }

        if (amt.length) {
          zeile += '<div class="amtlich">' + amt.join('') + '</div>';
        }
        /* Die amtlichen Bezeichnungen stehen unverändert dabei, so
           wie sie in deiner Tabelle hinterlegt sind. */
        var bloecke = [];

        if (e.ops) {
          bloecke.push('OPS  ' + e.ops +
            (e.opsText ? '\n     ' + e.opsText : ''));
        }

        if (e.icdText) {
          bloecke.push('ICD  ' + e.icdText.split('\n').join('\n     '));
        } else if (e.icd) {
          bloecke.push('ICD  ' + e.icd);
        }

        if (e.hinweis) { bloecke.push(e.hinweis); }
        if (e.vorlagen) { bloecke.push('Teil von: ' + e.vorlagen); }

        inhalt = bloecke.join('\n\n');
      } else if (gruppe === 'icd') {
        /* Titel ist die amtliche Bezeichnung aus deiner ICD-Tabelle. */
        kopf = '<span class="karteTitel">' + esc(e.titel) + '</span>' +
               '<span class="karteCode zweit">' + esc(e.icd) + '</span>';
        zeile = (e.diagnose || e.kategorie)
          ? '<div class="karteZeile">' +
              esc([e.kategorie, e.diagnose].filter(Boolean).join(' · ')) +
            '</div>'
          : '';

        zeile += '<div class="amtlich"><div><b>' + esc(e.icd) +
                 '</b><span>' + esc(e.titel) + '</span></div></div>';
        inhalt = 'ICD  ' + e.icd + '\n     ' + e.titel;
      } else if (gruppe === 'vorlagen') {
        /* OP-Vorlage: Name, zugehörige OPS-Codes, Textanfang. */
        kopf = '<span class="karteTitel">' + esc(e.titel) + '</span>' +
               (e.ops ? '<span class="karteCode">' + esc(e.ops) + '</span>' : '');
        zeile = '<div class="karteZeile">OP-Vorlage · ' +
          esc(String(e.text || '').replace(/\s+/g, ' ').slice(0, 62)) +
        '</div>';

        /* Zusammengesetzte Eingriffe zeigen ihre Einzelcodes. Ein
           Klick öffnet das Codier-Tool direkt bei diesem Code. */
        if (e.bestandteile && e.bestandteile.length > 1) {
          zeile += '<div class="teile">' +
            e.bestandteile.map(function(teil) {
              return '<button type="button" data-oeffnen="2" ' +
                'data-begriff="' + esc(teil.titel || teil.ops)
                  .replace(/"/g, '&quot;') + '">' +
                (teil.titel ? esc(teil.titel) + ' ' : '') +
                '<b>' + esc(teil.ops) + '</b></button>';
            }).join('') +
          '</div>';
        }

        inhalt = e.text;
      } else if (gruppe === 'zusaetze') {
        /* Wiederverwendbarer Zusatz - im Werkzeug ein Häkchen. */
        kopf = '<span class="karteTitel">' + esc(e.titel) + '</span>';

        /* Untertitel: der volle Situationstext, wenn er sich vom
           Titel unterscheidet - sonst der Anfang des Prozederetextes. */
        var zunter = (e.situation && e.situation !== e.titel)
          ? e.situation
          : String(e.prozedere || e.anamnese || e.befund || '');

        zeile = '<div class="karteZeile">Zusatz · ' +
          esc(String(zunter).replace(/\s+/g, ' ').slice(0, 78)) + '</div>';

        var zb = [];
        if (e.anamnese)  { zb.push('ANAMNESE\n' + e.anamnese); }
        if (e.befund)    { zb.push('BEFUND\n' + e.befund); }
        if (e.prozedere) { zb.push('PROZEDERE\n' + e.prozedere); }
        inhalt = zb.join('\n\n');
      } else if (gruppe === 'bausteine') {
        /* Prozedere-Baustein: die drei Textblöcke, wie im Werkzeug. */
        kopf = '<span class="karteTitel">' + esc(e.titel) + '</span>';

        /* Untertitel: die Situation, sonst der Anfang des
           Prozederetextes - damit gleichnamige Bausteine in der
           Liste auseinanderzuhalten sind. */
        /* Gruppe voran, dahinter die Situation - so steht dort
           dasselbe wie in der Aufklappliste des Werkzeugs, nur mit
           mehr Zusammenhang. */
        var unter = (e.situation && e.situation !== e.titel)
          ? e.situation
          : String(e.prozedere || e.befund || '')
              .replace(/\s+/g, ' ');

        if (e.kategorie) { unter = e.kategorie + ' · ' + unter; }
        unter = unter.slice(0, 92);

        zeile = unter
          ? '<div class="karteZeile">' + esc(unter) + '</div>' : '';

        var bloecke = [];
        if (e.anamnese)  { bloecke.push('ANAMNESE\n' + e.anamnese); }
        if (e.befund)    { bloecke.push('BEFUND\n' + e.befund); }
        if (e.prozedere) { bloecke.push('PROZEDERE\n' + e.prozedere); }
        inhalt = bloecke.join('\n\n');
      } else {
        /* Frei eingetragene Quelle - wie ein Rezept dargestellt. */
        kopf = '<span class="karteTitel">' + esc(e.titel) + '</span>';
        zeile = e.hinweis
          ? '<div class="karteZeile">' + esc(e.hinweis) + '</div>' : '';
        inhalt = e.text;
      }

      return '<div class="karte" data-kennung="' + kennung + '">' +
               '<div class="karteKopf">' + kopf + '</div>' + zeile +
               '<div class="karteInhalt" hidden contenteditable="true" ' +
                 'spellcheck="false">' + hebeHervor_(inhalt) + '</div>' +
               '<div class="karteHinweis" hidden>' +
                 'Änderungen hier gelten nur für dieses Kopieren.' +
               '</div>' +
               '<div class="karteWerkzeuge" hidden>' +
                 '<button type="button" class="haupt" data-oeffnen="' +
                   (gruppe === 'weitere'
                     ? Number(e.werkzeug)
                     : GRUPPE_ZU_WERKZEUG[gruppe]) +
                   '" data-begriff="' +
                   esc(e.titel).replace(/"/g, '&quot;') + '"' +
                   (e.kennung ? ' data-kennung="' + esc(e.kennung) + '"' : '') +
                   '>Öffnen</button>' +
                 '<button type="button" data-kopieren="' +
                   esc(inhalt).replace(/"/g, '&quot;') + '">Kopieren</button>' +
               '</div>' +
             '</div>';
    }

    function zeichneTreffer_(d) {
      var kasten = document.getElementById('treffer');
      kasten.classList.remove('werkzeugModus');
      trefferDaten = d;
      letzteTreffer = d;

      if (!d || !d.gesamt) {
        kasten.innerHTML =
          '<div class="trefferLeer">Nichts gefunden zu „' +
          esc(d ? d.begriff : '') + '“</div>';
        kasten.hidden = false;
        return;
      }

      var teile = [];

      /* Zusaetze zuerst: sie sind meist das, was im Schreibfluss
         gebraucht wird, und es sind wenige. */
      /* Reihenfolge nach Dringlichkeit im Alltag:
         OP-Vorlagen sparen beim Codieren am meisten Arbeit.
         Medikamente danach - steht ein Name in beiden Listen, ist
         fast immer das Rezept gemeint, nicht der Textbaustein.
         Dann die Zusätze, dann der Rest. */
      [['vorlagen', 'OP-Vorlagen'], ['rezepte', 'Rezepte'],
       ['bausteine', 'Text-Bausteine'], ['zusaetze', 'Zusätze'],
       ['codes', 'OPS / Eingriffe'], ['icd', 'ICD']]
        .forEach(function(g) {
          var liste = d[g[0]] || [];
          if (!liste.length) { return; }

          teile.push('<div class="trefferGruppe">' +
            '<div class="trefferKopf">' + g[1] + '</div>' +
            liste.map(function(e, i) { return karteHtml_(g[0], e, i); }).join('') +
          '</div>');
        });

      /* Frei eingetragene Quellen - nach ihrer eigenen Ueberschrift
         gebuendelt, damit Text-Bausteine nicht zwischen Codes stehen. */
      var nachGruppe = {};
      (d.weitere || []).forEach(function(e) {
        (nachGruppe[e.gruppe] = nachGruppe[e.gruppe] || []).push(e);
      });

      Object.keys(nachGruppe).forEach(function(name) {
        teile.push('<div class="trefferGruppe">' +
          '<div class="trefferKopf">' + esc(name) + '</div>' +
          nachGruppe[name].map(function(e, i) {
            return karteHtml_('weitere', e, i);
          }).join('') +
        '</div>');
      });

      kasten.innerHTML = teile.join('');
      kasten.hidden = false;
    }

    /* =====================================================================
       SUCHE IM BROWSER
       =====================================================================
       Die Daten liegen nach dem Anmelden hier. Jeder Tastendruck ist
       damit ein Vergleich im Arbeitsspeicher statt eines Serverwegs -
       das ist der Unterschied zwischen traege und sofort.
       ===================================================================== */

    var suchDaten = null;
    var MAX_JE_GRUPPE = 12;

    /* =====================================================================
       ZWISCHENSPEICHER AUF DEM GERÄT
       =====================================================================
       Die Suchdaten werden lokal abgelegt. Beim zweiten Öffnen ist die
       Suche sofort da, ohne auf den Server zu warten - am Handy der
       Unterschied zwischen "lädt" und "ist da".

       Vom Server wird trotzdem jedes Mal neu geholt, nur im
       Hintergrund. Was du siehst, ist also höchstens Sekunden alt und
       wird leise ersetzt, sobald das Neue eintrifft. Steht gerade eine
       Trefferliste offen, wird sie still nachgezogen.

       Beim Abmelden und beim Aktualisieren wird alles gelöscht.
       ===================================================================== */

    var SUCHDATEN_ORT = 'cockpit_suchdaten_v1';

    function ladeSuchdatenVomGeraet_() {
      try {
        var roh = localStorage.getItem(SUCHDATEN_ORT);
        if (!roh) { return; }

        var paket = JSON.parse(roh);
        if (paket && paket.daten) { suchDaten = paket.daten; }
      } catch (ignoriert) {}
    }

    function legeSuchdatenAb_(d) {
      try {
        localStorage.setItem(SUCHDATEN_ORT,
          JSON.stringify({ stand: Date.now(), daten: d }));
      } catch (ignoriert) {
        /* Speicher voll oder gesperrt - dann eben nur im
           Arbeitsspeicher. Die Suche funktioniert trotzdem. */
      }
    }

    function loescheSuchdatenVomGeraet_() {
      try { localStorage.removeItem(SUCHDATEN_ORT); } catch (ignoriert) {}
    }

    function holeSuchdaten_() {
      if (!ticket) { return; }

      google.script.run
        .withSuccessHandler(function(d) {
          if (!d) { return; }

          suchDaten = d;
          legeSuchdatenAb_(d);

          /* Trefferliste still nachziehen, falls gerade offen. */
          if (letzteSuche && letzteSuche.length >= 2) { suche_(letzteSuche); }
        })
        .withFailureHandler(serverFehler_)
        .holeSuchdaten(ticket);
    }

    /* Klein, ohne Umlaute und Sonderzeichen - wie auf dem Server. */
    function suchform_(text) {
      return String(text || '')
        .toLowerCase()
        .replace(/ä/g, 'ae').replace(/ö/g, 'oe').replace(/ü/g, 'ue')
        .replace(/ß/g, 'ss')
        .replace(/[^a-z0-9]/g, '');
    }

    function guete_(eintrag, felder, wort) {
      var titel = suchform_(eintrag.titel);

      if (titel.indexOf(wort) === 0) { return 100 - titel.length; }
      if (titel.indexOf(wort) !== -1) { return 60; }

      for (var i = 0; i < felder.length; i++) {
        if (suchform_(eintrag[felder[i]]).indexOf(wort) !== -1) { return 30; }
      }

      return 0;
    }

    function filtere_(liste, felder, wort) {
      return (liste || [])
        .map(function(e) { return { e: e, p: guete_(e, felder, wort) }; })
        .filter(function(x) { return x.p > 0; })
        .sort(function(a, b) { return b.p - a.p; })
        .slice(0, MAX_JE_GRUPPE)
        .map(function(x) { return x.e; });
    }

    function suche_(begriff) {
      if (!suchDaten) {
        /* Daten noch unterwegs - beim naechsten Tastendruck da. */
        holeSuchdaten_();
        return;
      }

      var wort = suchform_(begriff);
      if (wort.length < 2) { versteckeTreffer_(); return; }

      var rezepte = filtere_(suchDaten.rezepte, ['text', 'hinweis'], wort);
      var bausteine = filtere_(suchDaten.bausteine,
        ['situation', 'kategorie', 'prozedere', 'anamnese', 'befund'], wort);
      var zusaetze = filtere_(suchDaten.zusaetze,
        ['situation', 'prozedere', 'anamnese', 'befund'], wort);
      var vorlagen = filtere_(suchDaten.vorlagen, ['text', 'ops'], wort);
      /* "vorlagen" trägt die Namen der Sammel-Eingriffe. Dadurch
         findet "Panendoskopie" auch die Mikrolaryngoskopie, obwohl
         das Wort in deren Zeile nicht vorkommt. */
      var codes = filtere_(suchDaten.codes,
        ['begriffe', 'ops', 'icd', 'kategorie', 'vorlagen',
         'opsText', 'icdText'], wort);
      var icd = filtere_(suchDaten.icd, ['icd', 'diagnose', 'kategorie'], wort);
      var weitere = filtere_(suchDaten.weitere, ['text', 'hinweis'], wort);

      zeichneTreffer_({
        begriff: begriff,
        rezepte: rezepte,
        bausteine: bausteine,
        zusaetze: zusaetze,
        vorlagen: vorlagen,
        codes: codes,
        icd: icd,
        weitere: weitere,
        gesamt: rezepte.length + bausteine.length + zusaetze.length +
                vorlagen.length + codes.length + icd.length + weitere.length
      });
    }

    function speichereEingabe_() {
      var feld = document.getElementById('universal');
      var text = feld.value.trim();
      if (!text || !ticket) { return; }

      /*
       * Ein reiner Befehl ohne Zusatz - "brief", "nachtrag", "wahl" -
       * wird SOFORT ausgelöst, noch bevor gespeichert wird.
       *
       * Vorher lief erst der Serveraufruf zum Speichern durch, und
       * erst dessen Antwort stieß den Brief an. Das kostete einen
       * vollen Weg zum Server, bevor überhaupt etwas passierte.
       * Gespeichert wird trotzdem, nur eben nebenher.
       */
      var sofort = null;
      var kurz = text.toLowerCase().replace(/[.,;:!?\s]+$/, '');

      if (kurz === 'brief' || kurz === 'briefe') { sofort = 'brief'; }
      else if (kurz === 'nachtrag' || kurz === 'nachtragen') { sofort = 'nachtrag'; }
      else if (kurz === 'wahl') { sofort = 'wahl'; }

      if (sofort) { loeseBriefAus_(sofort); }

      var hinweis = document.getElementById('suchfeldZiel');
      if (!sofort) { hinweis.textContent = 'Speichere …'; }
      feld.disabled = true;

      google.script.run
        .withSuccessHandler(function(r) {
          feld.disabled = false;
          feld.value = '';
          feld.style.height = 'auto';

          var knopf = document.getElementById('suchfeldSenden');
          if (knopf) { knopf.classList.remove('bereit'); }
          versteckeTreffer_();

          /* Was eben gespeichert wurde, kann ein loses Ende sein
             oder eines geschlossen haben - also gleich nachsehen. */
          holeFaeden_();

          /* Beim Sofortstart steht dort schon der Haken - nicht
             überschreiben. */
          if (!sofort) {
            hinweis.textContent = (r && r.message) || 'Gespeichert';
            hinweis.hidden = false;
            setTimeout(function() { hinweis.hidden = true; }, 10000);
          }

          /* Brief, Nachtrag und Wahl müssen jetzt noch ausgelöst
             werden - das Skript darf das nicht selbst. Wurde oben
             schon sofort ausgelöst, nicht ein zweites Mal. */
          if (r && r.befehl && !sofort) {
            loeseBriefAus_(r.befehl, r.vorlage);
          }

          /* Ist die Vorlage nicht eindeutig, fragt der Server nach.
             Dann erst waehlen, dann ausloesen. */
          if (r && r.auswahl && r.auswahl.length) {
            zeigeVorlagenwahl_(r.auswahl, r.wartetAuf || 'brief');
          }

          /* Aufgaben und Faelle aendern die Box - sofort nachziehen. */
          holeFaellig_();
          holeZahlen_();
          feld.focus();
        })
        .withFailureHandler(function() {
          feld.disabled = false;
          hinweis.textContent = 'Fehlgeschlagen';
        })
        .speichereEingabe(text, ticket);
    }

    /*
     * Oeffnet das Werkzeug hinter einem Treffer - als vollwertiges
     * Fenster, nicht als Nachbau. Der Suchbegriff wird mitgegeben,
     * damit es gleich beim richtigen Eintrag steht.
     */
    /* Merkt sich die letzte Trefferliste, damit der Zurueck-Pfeil
       sie ohne neue Suche wiederherstellen kann. */
    var letzteTreffer = null;

    /*
     * Klappt das Werkzeug unter dem Suchfeld auf - im selben Kasten,
     * in dem eben noch die Treffer standen. Nichts im Arbeitsbereich
     * wird angefasst.
     */
    function zeigeWerkzeugImFeld_(toolIndex, begriff, kennung) {
      var werkzeug = TOOLS[toolIndex];
      if (!werkzeug || !werkzeug.url) { return; }

      var kasten = document.getElementById('treffer');
      var adresse = werkzeug.url +
        (werkzeug.url.indexOf('?') === -1 ? '?' : '&') +
        'q=' + encodeURIComponent(begriff || '');

      /* Die Kennung macht den Eintrag eindeutig, auch wenn zwei
         Zeilen denselben Namen tragen. */

    /* =====================================================================
       BRIEF FERTIG
       =====================================================================
       Der Puls sagt nur Bescheid. In die Zwischenablage kommt der Text
       erst beim Antippen der Lupe im Suchfeld - unauffaellig, weil
       niemand eine Lupe fuer einen Knopf haelt.
       ===================================================================== */

    var briefText = '';
    var briefTakt = null;
    var briefZeitpunkt = 0;

    /* Ob ein Brief schon angekündigt wurde, entscheidet der Server.
       Hier wird nur zusätzlich gemerkt, was dieses Fenster bereits
       gezeigt hat - für den Fall, dass zwei Abfragen dicht
       aufeinander dieselbe Antwort bekommen. */
    var briefGepulst = '';

    /* Nach dieser Zeit ist der Brief nicht mehr abzuholen. Der
       Server liefert ihn ohnehin nur so lange; hier steht es
       zusätzlich, damit ein stehendes Fenster nicht ewig eine
       Kopiermöglichkeit anbietet. */
    var BRIEF_ABHOLBAR_MINUTEN = 10;

    function zeigeBriefPuls_() {
      var puls = document.getElementById('briefPuls');
      if (!puls) { return; }

      /* Neu starten, auch wenn er gerade laeuft. */
      puls.classList.remove('an');
      void puls.offsetWidth;
      puls.classList.add('an');

      window.setTimeout(function() { puls.classList.remove('an'); }, 15200);
    }

    function holeBrief_() {
      if (!ticket) { return; }

      google.script.run
        .withSuccessHandler(function(b) {
          var feld = document.getElementById('suchfeld');

          if (!b || !b.vorhanden) {
            briefText = '';
            briefZeitpunkt = 0;
            if (feld) { feld.classList.remove('briefDa'); }
            return;
          }

          briefText = b.text || '';
          briefZeitpunkt = Date.now() - (b.alterSekunden || 0) * 1000;

          if (feld) { feld.classList.add('briefDa'); }

          /* Der Server sagt, ob dieser Brief neu ist. Nur dann. */
          if (b.neu && b.id && b.id !== briefGepulst) {
            briefGepulst = b.id;
            zeigeBriefPuls_();
          }

          /* Abholfrist: danach erlischt die Lupe von selbst, auch
             wenn niemand mehr nachfragt. */
          var restMs = BRIEF_ABHOLBAR_MINUTEN * 60000 -
                       (Date.now() - briefZeitpunkt);

          if (restMs <= 0) {
            briefText = '';
            if (feld) { feld.classList.remove('briefDa'); }
          } else {
            window.setTimeout(function() {
              if (Date.now() - briefZeitpunkt >=
                  BRIEF_ABHOLBAR_MINUTEN * 60000) {
                briefText = '';
                var f2 = document.getElementById('suchfeld');
                if (f2) { f2.classList.remove('briefDa'); }
              }
            }, restMs + 500);
          }
        })
        .withFailureHandler(serverFehler_)
        .holeBrief(ticket);
    }

    /* =====================================================================
       BRIEFLAYOUT
       =====================================================================
       Unverändert aus dem Neu-Widget übernommen, damit ein Brief über
       die Lupe genauso aussieht wie über den grünen Knopf.

       Arial 11 pt, Zeilenhöhe 1.0, Überschriften fett und
       unterstrichen. Zeilen werden mit <br> getrennt, nicht mit
       Absätzen - sonst fügt Word zusätzliche Abstände ein.
       ===================================================================== */

    function istUeberschrift_(zeile) {
      return /^(Diagnose|Anamnese|Untersuchungsbefund|Procedere|Prozedere):$/i
        .test(String(zeile || '').trim());
    }

    /*
     * Bereitet den Rohtext auf, bevor er formatiert wird.
     * Unveraendert aus dem gruenen Knopf uebernommen.
     *
     * Genau dieser Schritt hat gefehlt: Ohne ihn wandern
     * Zeilenendezeichen aus der Tabelle, nachlaufende Leerzeichen
     * und vier- oder fuenffache Leerzeilen mit in den Brief. Die
     * Formatierung war identisch - nur der Text, auf den sie
     * angewendet wurde, war es nicht.
     */
    function briefTextVorbereiten_(text) {
      var output = String(text || '');

      output = output
        .replace(/\r\n/g, '\n')
        .replace(/\r/g, '\n');

      /* Nachlaufende Leerzeichen je Zeile weg. */
      output = output
        .split('\n')
        .map(function (line) { return line.replace(/[ \t]+$/g, ''); })
        .join('\n');

      /* Drei oder mehr Umbrueche werden zu zweien - also hoechstens
         eine Leerzeile zwischen Absaetzen. */
      output = output.replace(/\n(?:[ \t]*\n){2,}/g, '\n\n');

      /* Leere Zeilen nur am Anfang und Ende entfernen. */
      output = output
        .replace(/^(?:[ \t]*\n)+/g, '')
        .replace(/(?:\n[ \t]*)+$/g, '');

      return output;
    }

    function briefAlsWordHtml_(text) {
      var zeilen = String(text || '').split('\n');

      var gesetzt = zeilen.map(function(zeile) {
        if (zeile === '') { return ''; }

        var sicher = esc(zeile);

        if (istUeberschrift_(zeile)) {
          return '<span style="font-family:Arial,Helvetica,sans-serif;' +
                 'font-size:11pt;font-weight:700;font-style:normal;' +
                 'text-decoration:underline;">' + sicher + '</span>';
        }

        return '<span style="font-family:Arial,Helvetica,sans-serif;' +
               'font-size:11pt;font-weight:400;font-style:normal;' +
               'text-decoration:none;">' + sicher + '</span>';
      });

      return '<!DOCTYPE html><html><head><meta charset="UTF-8"></head>' +
             '<body style="margin:0;padding:0;">' +
             '<div style="font-family:Arial,Helvetica,sans-serif;' +
             'font-size:11pt;font-weight:400;font-style:normal;' +
             'line-height:1.0;margin:0;padding:0;' +
             'mso-line-height-rule:exactly;">' +
             gesetzt.join('<br>') +
             '</div></body></html>';
    }

    function briefInZwischenablage_() {
      if (!briefText) { return; }

      /* Doppelt gesichert: auch wenn die Uhr eines Fensters
         stehengeblieben ist. */
      if (briefZeitpunkt &&
          Date.now() - briefZeitpunkt > BRIEF_ABHOLBAR_MINUTEN * 60000) {
        briefText = '';
        var feldAlt = document.getElementById('suchfeld');
        if (feldAlt) { feldAlt.classList.remove('briefDa'); }
        return;
      }

      var fertig = function() {
        var hinweis = document.getElementById('suchfeldZiel');
        if (!hinweis) { return; }

        hinweis.textContent = '✓';
        hinweis.className = 'suchfeldZiel speichern';
        hinweis.hidden = false;

        window.setTimeout(function() { hinweis.hidden = true; }, 10000);
      };

      /* Erst aufbereiten, dann formatieren - genau in dieser
         Reihenfolge macht es der grüne Knopf. Beides zusammen in
         die Zwischenablage: Word nimmt das Layout, ein einfaches
         Feld den Text. */
      var reinerText = briefTextVorbereiten_(briefText);
      var alsHtml = briefAlsWordHtml_(reinerText);

      if (navigator.clipboard &&
          typeof navigator.clipboard.write === 'function' &&
          typeof ClipboardItem !== 'undefined') {

        var stueck = new ClipboardItem({
          'text/plain': new Blob([reinerText], { type: 'text/plain;charset=utf-8' }),
          'text/html': new Blob([alsHtml], { type: 'text/html;charset=utf-8' })
        });

        navigator.clipboard.write([stueck]).then(fertig).catch(function() {
          navigator.clipboard.writeText(reinerText).then(fertig).catch(function() {});
        });
        return;
      }

      navigator.clipboard.writeText(reinerText).then(fertig).catch(function() {});
    }

    function initBrief_() {
      var puls = document.getElementById('briefPuls');

      /* Antippen blendet nur aus. Kopiert wird ueber die Lupe -

      if (puls) {

        if (ring) {
          ring.addEventListener('click', function() {

      var lupe = document.querySelector('.suchfeldZeile > svg');

    /* =====================================================================
       AUFMERKSAMER MODUS
       =====================================================================
       Im Normalfall reicht ein Blick alle 25 Sekunden - ein Brief
       entsteht selten.

       Direkt nach einem Aufruf ist das aber zu träge: Der Brief liegt
       womöglich schon da, und der Puls käme eine halbe Minute später.
       Deshalb wird zwei Minuten lang alle drei Sekunden nachgesehen
       und danach wieder auf den ruhigen Takt zurückgeschaltet.
       ===================================================================== */

    var BRIEF_RUHIG = 25000;
    var BRIEF_WACH = 3000;
    var briefWachBis = 0;

    function setzeBriefTakt_(abstand) {
      clearInterval(briefTakt);
      briefTakt = setInterval(function() {
        holeBrief_();

        /* Wachphase vorbei? Dann zurück in den ruhigen Takt. */
        if (briefWachBis && Date.now() > briefWachBis) {
          briefWachBis = 0;
          setzeBriefTakt_(BRIEF_RUHIG);
        }
      }, abstand);
    }

    function starteBrief_() {
      holeBrief_();
      setzeBriefTakt_(BRIEF_RUHIG);
    }

    /* Nach einem Aufruf zwei Minuten lang häufig nachsehen. */
    function briefErwarten_() {
      briefWachBis = Date.now() + 120000;
      setzeBriefTakt_(BRIEF_WACH);
      window.setTimeout(holeBrief_, 800);
    }

    /*
     * Vorlagenauswahl, wenn der Server nicht entscheiden konnte.

    function zeigeVorlagenwahl_(vorlagen, befehl) {
