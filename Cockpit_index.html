    function openMenuItem(index) {
      var item = MENU_ITEMS[index];
      if (!item) { return; }
      openToolIndices(item.tools);
    }

    function openUtilityItem(index) {
      var item = UTILITY_ITEMS[index];
      if (!item) { return; }
      openToolIndices(item.tools);
    }

    function showStart() {
      document.getElementById('start').style.display = 'flex';
      document.getElementById('work').style.display = 'none';
      document.getElementById('work').innerHTML = '';

      /* Merkt, dass wir auf der Startseite sind - der Übersicht-Knopf
         blendet sich dann aus, weil er nirgendwohin führt. */
      document.body.classList.add('aufStart');

      setActive(0);
      registriereAktivitaet();
    }

    /* ===== FENSTERANSICHT ===== */

    function setActive(n) {
      ['l1','l2','l3'].forEach(function(id, index) {
        document.getElementById(id).classList.toggle('active', index + 1 === n);
      });
    }

    function createOptions() {
      var html = '<option value="">\u2014 Anwendung w\u00e4hlen \u2014</option>';

      TOOLS.forEach(function(tool, index) {
        if (index === SCHLAF_TOOL_INDEX) { return; }
        if (index === ZULETZT_TOOL_INDEX) { return; }
        var sichtbarerName = tool.dropdownName || tool.name;
        html += '<option value="' + index + '">' +
                  esc(tool.icon + ' ' + sichtbarerName) +
                '</option>';
      });

      return html;
    }

    /* -----------------------------------------------------------------
       FENSTERAUFTEILUNG

       Der Arbeitsbereich ist eine Reihe von Spalten. Jede Spalte kann
       ein oder mehrere Fenster uebereinander halten. Dadurch laesst
       sich ein Fenster sowohl daneben als auch darunter andocken.

           #work  →  .spalte | .resizer | .spalte
                        .pane
                        .rowresizer
                        .pane

       Fenster werden nie ueber feste Nummern angesprochen; ihre
       Position ergibt sich aus dem DOM.
       ----------------------------------------------------------------- */

    var MAX_PANES = 8;

    function workEl() { return document.getElementById('work'); }

    function spaltenListe() {
      return Array.prototype.slice.call(workEl().children).filter(function(kind) {
        return kind.classList.contains('spalte');
      });
    }

    function allePanes() { return workEl().querySelectorAll('.pane'); }

    function paneIndexVon(element) {
      var pane = element.closest ? element.closest('.pane') : null;
      if (!pane) { return -1; }
      return Array.prototype.indexOf.call(allePanes(), pane);
    }

    function paneMarkup(options) {
      return '<div class="pane">' +
               '<div class="panebar" draggable="true" ' +
                 'title="Fensterleiste ziehen, um umzusortieren">' +
                 '<button class="collapsebtn" type="button" title="Einklappen" ' +
                   'onclick="togglePaneCollapseVon(this)">\u2039</button>' +
                 '<select onchange="loadPane(this)">' + options + '</select>' +
                 '<button class="reload" type="button" title="Neu laden" ' +
                   'onclick="reloadPaneVon(this)">\u21bb</button>' +
                 '<button class="closebtn" type="button" title="Fenster schlie\u00dfen" ' +
                   'onclick="entfernePaneVon(this)">\u00d7</button>' +
               '</div>' +
               '<div class="placeholder">Anwendung oben ausw\u00e4hlen</div>' +
             '</div>';
    }

    function neueSpalte(paneElement) {
      var spalte = document.createElement('div');
      spalte.className = 'spalte';
      spalte.style.flex = '1 1 0';
      spalte.dataset.anteil = '1';
      if (paneElement) { spalte.appendChild(paneElement); }
      return spalte;
    }

    function neuesPane(toolIndex) {
      var huelle = document.createElement('div');
      huelle.innerHTML = paneMarkup(createOptions());
      var pane = huelle.firstChild;

      if (toolIndex !== null && toolIndex !== undefined && toolIndex !== '') {
        setTimeout(function() {
          setzeWerkzeug(pane.querySelector('select'), Number(toolIndex));
        }, 0);
      }

      return pane;
    }

    /* Setzt Trennleisten zwischen Spalten und innerhalb der Spalten. */
    function ordneResizer() {
      var work = workEl();

      work.querySelectorAll('.resizer, .rowresizer').forEach(function(leiste) {
        leiste.remove();
      });

      var spalten = spaltenListe();

      for (var i = 0; i < spalten.length - 1; i++) {
        spalten[i].insertAdjacentHTML('afterend', '<div class="resizer"></div>');
      }

      spalten.forEach(function(spalte) {
        var panes = Array.prototype.slice.call(spalte.children).filter(function(k) {
          return k.classList.contains('pane');
        });
        for (var k = 0; k < panes.length - 1; k++) {
          panes[k].insertAdjacentHTML('afterend', '<div class="rowresizer"></div>');
        }
      });

      initResizers();
    }

    /* Sobald Fenster geöffnet werden, ist die Startseite verlassen -
       dann führt der Übersicht-Knopf wieder irgendwohin. */
    function verlasseStart_() {
      document.body.classList.remove('aufStart');
    }

    function setLayout(n, initialRatios) {
      verlasseStart_();

      var work = workEl();
      var vorher = [];

      work.querySelectorAll('.pane').forEach(function(pane) {
        vorher.push(pane.dataset.toolIndex || '');
      });

      document.getElementById('start').style.display = 'none';
      work.style.display = 'flex';
      setActive(n);

      /*
       * Beim normalen Layoutwechsel ist die Kombi-Ansicht beendet.
       * oeffneBriefAnsicht setzt das Flag danach wieder.
       */
      kombiAnsichtAktiv = false;

      work.innerHTML = '';

      for (var i = 0; i < n; i++) {
        work.appendChild(neueSpalte(neuesPane(null)));
      }

      ordneResizer();

      if (Array.isArray(initialRatios) && initialRatios.length === n) {
        applyPaneRatios(initialRatios);
      }

      var selects = work.querySelectorAll('.pane select');

      for (var k = 0; k < selects.length && k < vorher.length; k++) {
        if (vorher[k] === '') { continue; }

        var alterToolIndex = Number(vorher[k]);
        if (alterToolIndex === SCHLAF_TOOL_INDEX) { continue; }
        if (alterToolIndex === ZULETZT_TOOL_INDEX) { continue; }

        selects[k].value = String(alterToolIndex);
        loadPane(selects[k]);
      }

      registriereAktivitaet();
    }

    /*
     * Fuegt ein Fenster ein. richtung bestimmt, wo:
     *   'links' / 'rechts'  → neue Spalte neben der Spalte des Ziels
     *   'oben'  / 'unten'   → in derselben Spalte ueber oder unter dem Ziel
     *   null                → neue Spalte am Ende
     */
    function fuegePaneHinzu(toolIndex, zielPane, richtung) {
      verlasseStart_();

      var work = workEl();

      if (work.querySelectorAll('.pane').length >= MAX_PANES) { return null; }

      document.getElementById('start').style.display = 'none';
      work.style.display = 'flex';

      if (!spaltenListe().length) {
        work.innerHTML = '';
        work.appendChild(neueSpalte(neuesPane(toolIndex)));
        ordneResizer();
        verteileGleichmaessig();
        setActive(1);
        return work.querySelector('.pane');
      }

      var pane = neuesPane(toolIndex);

      if (!zielPane || !richtung) {
        work.appendChild(neueSpalte(pane));
      } else if (richtung === 'oben' || richtung === 'unten') {
        var spalte = zielPane.parentNode;
        if (richtung === 'oben') {
          spalte.insertBefore(pane, zielPane);
        } else if (zielPane.nextSibling) {
          spalte.insertBefore(pane, zielPane.nextSibling);
        } else {
          spalte.appendChild(pane);
        }
      } else {
        var zielSpalte = zielPane.parentNode;
        var frischeSpalte = neueSpalte(pane);
        if (richtung === 'links') {
          work.insertBefore(frischeSpalte, zielSpalte);
        } else if (zielSpalte.nextSibling) {
          work.insertBefore(frischeSpalte, zielSpalte.nextSibling);
        } else {
          work.appendChild(frischeSpalte);
        }
      }

      ordneResizer();
      verteileGleichmaessig();
      setActive(spaltenListe().length);
      registriereAktivitaet();
      return pane;
    }

    /* Verschiebt ein bestehendes Fenster an eine neue Position. */
    function verschiebePane(quellPane, zielPane, richtung) {
      if (!quellPane || !zielPane || quellPane === zielPane) { return; }

      var work = workEl();
      var alteSpalte = quellPane.parentNode;

      if (richtung === 'oben' || richtung === 'unten') {
        var spalte = zielPane.parentNode;
        if (richtung === 'oben') {
          spalte.insertBefore(quellPane, zielPane);
        } else if (zielPane.nextSibling) {
          spalte.insertBefore(quellPane, zielPane.nextSibling);
        } else {
          spalte.appendChild(quellPane);
        }
      } else {
        var zielSpalte = zielPane.parentNode;
        var frischeSpalte = neueSpalte(quellPane);
        if (richtung === 'links') {
          work.insertBefore(frischeSpalte, zielSpalte);
        } else if (zielSpalte.nextSibling) {
          work.insertBefore(frischeSpalte, zielSpalte.nextSibling);
        } else {
          work.appendChild(frischeSpalte);
        }
      }

      raeumeLeereSpalten(alteSpalte);
      ordneResizer();
      verteileGleichmaessig();
      setActive(spaltenListe().length);
      registriereAktivitaet();
    }

    function raeumeLeereSpalten(bevorzugt) {
      if (bevorzugt && bevorzugt.classList &&
          bevorzugt.classList.contains('spalte') &&
          !bevorzugt.querySelector('.pane')) {
        bevorzugt.remove();
      }

      spaltenListe().forEach(function(spalte) {
        if (!spalte.querySelector('.pane')) { spalte.remove(); }
      });
    }

    function entfernePaneVon(button) {
      var pane = button.closest('.pane');
      if (!pane) { return; }

      var spalte = pane.parentNode;
      pane.remove();
      raeumeLeereSpalten(spalte);
      ordneResizer();

      if (!workEl().querySelector('.pane')) {
        showStart();
        return;
      }

      verteileGleichmaessig();
      setActive(spaltenListe().length);
      registriereAktivitaet();
    }

    /* Gibt Spalten und Fenstern innerhalb der Spalten gleiche Anteile. */
    function verteileGleichmaessig() {
      spaltenListe().forEach(function(spalte) {
        if (!spalte.classList.contains('collapsed')) {
          spalte.style.width = '';
          spalte.style.flex = '1 1 0';
          spalte.dataset.anteil = '1';
        }

        spalte.querySelectorAll('.pane').forEach(function(pane) {
          if (pane.classList.contains('collapsed')) { return; }
          pane.style.height = '';
          pane.style.width = '';
          pane.style.flex = '1 1 0';
          pane.dataset.anteil = '1';
        });
      });
    }

    function applyPaneRatios(ratios) {
      spaltenListe().forEach(function(spalte, index) {
        var ratio = Number(ratios[index]);
        if (!Number.isFinite(ratio) || ratio <= 0) { ratio = 1; }
        spalte.style.flex = ratio + ' ' + ratio + ' 0';
        spalte.style.width = '';
        spalte.dataset.anteil = String(ratio);
      });
    }

    function openToolIndices(toolIndices) {
      if (!toolIndices || !toolIndices.length) { return; }

      var enthaeltVersteckte = toolIndices.some(function(index) {
        var i = Number(index);
        return i === SCHLAF_TOOL_INDEX || i === ZULETZT_TOOL_INDEX;
      });

      if (enthaeltVersteckte) { return; }

      openToolIndicesIntern(toolIndices, null, false);
    }

    function openToolIndicesIntern(toolIndices, initialRatios, schlafErlaubt) {
      if (!toolIndices || !toolIndices.length) { return; }

      var anzahl = Math.min(toolIndices.length, MAX_PANES);

      setLayout(anzahl,
        Array.isArray(initialRatios) ? initialRatios.slice(0, anzahl) : null);

      var selects = document.querySelectorAll('#work .pane select');

      for (var i = 0; i < anzahl; i++) {
        var toolIndex = Number(toolIndices[i]);

        if (toolIndex === SCHLAF_TOOL_INDEX && schlafErlaubt !== true) { continue; }
        setzeWerkzeug(selects[i], toolIndex);
      }
    }

    /*
     * Laedt ein Werkzeug in ein Fenster - auch die versteckten, denn
     * dieser Weg wird nur intern und beim Wiederherstellen benutzt.
     */
    function setzeWerkzeug(select, toolIndex) {
      if (!select) { return; }

      if (toolIndex === SCHLAF_TOOL_INDEX || toolIndex === ZULETZT_TOOL_INDEX) {
        loadToolDirectly(select, toolIndex, true);
      } else {
        select.value = String(toolIndex);
        loadPane(select);
      }
    }

    function loadPane(select) {
      var pane = select.closest('.pane');

      if (select.value === '') {
        showPlaceholder(pane, 'Anwendung oben ausw\u00e4hlen');
        return;
      }

      var toolIndex = Number(select.value);

      if (toolIndex === SCHLAF_TOOL_INDEX || toolIndex === ZULETZT_TOOL_INDEX) {
        select.value = '';
        showPlaceholder(pane, 'Anwendung oben ausw\u00e4hlen');
        return;
      }

      loadToolDirectly(select, toolIndex, false);
    }

    function loadToolDirectly(select, toolIndex, verstecktErlaubt, zusatz) {
      var pane = select.closest('.pane');

      var istVersteckt = toolIndex === SCHLAF_TOOL_INDEX ||
                         toolIndex === ZULETZT_TOOL_INDEX;

      if (istVersteckt && verstecktErlaubt !== true) { return; }

      var tool = TOOLS[toolIndex];

      if (!tool || !tool.url) {
        showPlaceholder(pane, 'F\u00fcr diese Anwendung ist keine URL eingetragen.');
        return;
      }

      if (istVersteckt) {
        select.value = '';
        select.setAttribute('aria-label', 'Gesch\u00fctzte Anwendung');
      }

      var vorhandenerInhalt = pane.querySelector('iframe, .placeholder');

      var adresse = tool.url;

      /* Vorauswahl: das Werkzeug bekommt den Suchbegriff mit und
         springt selbst an die richtige Stelle. So oeffnet sich die
         vollstaendige App - mit Gewichtsrechner, Berichtsvorlagen und
         allem, was sie sonst kann. */
      if (zusatz) {
        adresse += (adresse.indexOf('?') === -1 ? '?' : '&') + zusatz;
      }

      var iframeHtml = '<iframe src="' + esc(adresse) + '" ' +
                       'allow="clipboard-write; microphone"></iframe>';

      if (vorhandenerInhalt) {
        vorhandenerInhalt.outerHTML = iframeHtml;
      } else {
        pane.insertAdjacentHTML('beforeend', iframeHtml);
      }

      pane.dataset.toolIndex = String(toolIndex);
      registriereAktivitaet();
    }

    function showPlaceholder(pane, text) {
      if (!pane) { return; }

      var vorhandenerInhalt = pane.querySelector('iframe, .placeholder');
      var html = '<div class="placeholder">' + esc(text) + '</div>';

      if (vorhandenerInhalt) {
        vorhandenerInhalt.outerHTML = html;
      } else {
        pane.insertAdjacentHTML('beforeend', html);
      }

      delete pane.dataset.toolIndex;
    }

    function reloadPaneVon(button) {
      var pane = button.closest('.pane');
      if (!pane) { return; }

      var iframe = pane.querySelector('iframe');
      if (iframe) {
        iframe.src = iframe.src;
        registriereAktivitaet();
      }
    }

    function togglePaneCollapseVon(button) {
      var index = paneIndexVon(button);
      if (index >= 0) { togglePaneCollapse(index); }
    }

    /* =====================================================================
       ANDOCKEN
       =====================================================================
       Gezogen wird entweder der Plus-Knopf im Kopf (neues, leeres
       Fenster) oder die Leiste eines vorhandenen Fensters (umsortieren).
       Beim Ziehen zeigt ein Rahmen, wo das Fenster landen wuerde:
       an den Seiten daneben, oben oder unten darunter.
       ===================================================================== */

    var ziehtNeuesFenster = false;
    var ziehendesPane = null;
    var letzteZone = null;

    function zielAnzeigeEl() {
      var work = workEl();
      var anzeige = work.querySelector('.andockZiel');

      if (!anzeige) {
        anzeige = document.createElement('div');
        anzeige.className = 'andockZiel';
        work.appendChild(anzeige);
      }

      return anzeige;
    }

    function versteckeZielAnzeige() {
      var work = workEl();
      var anzeige = work.querySelector('.andockZiel');
      if (anzeige) { anzeige.classList.remove('sichtbar'); }
      letzteZone = null;
    }

    /*
     * Bestimmt aus der Zeigerposition, an welche Kante angedockt wird.
     * Nahe am Rand entsteht eine neue Spalte oder Reihe, in der Mitte
     * wird rechts angehaengt.
     */
    function zoneBestimmen(event) {
      var work = workEl();
      var pane = event.target.closest ? event.target.closest('.pane') : null;

      if (!pane) {
        var panes = work.querySelectorAll('.pane');
        if (!panes.length) { return null; }
        return { zielPane: panes[panes.length - 1], richtung: 'rechts' };
      }

      var r = pane.getBoundingClientRect();
      var xAnteil = (event.clientX - r.left) / r.width;
      var yAnteil = (event.clientY - r.top) / r.height;

      var randX = Math.min(xAnteil, 1 - xAnteil);
      var randY = Math.min(yAnteil, 1 - yAnteil);

      /* Die naehere Kante gewinnt. Waagerecht wird leicht bevorzugt,
         weil Fenster meist nebeneinander gewuenscht sind. */
      if (randX * 0.85 <= randY) {
        return { zielPane: pane, richtung: xAnteil < 0.5 ? 'links' : 'rechts' };
      }
      return { zielPane: pane, richtung: yAnteil < 0.5 ? 'oben' : 'unten' };
    }

    function zeigeZone(zone) {
      if (!zone) { versteckeZielAnzeige(); return; }

      var work = workEl();
      var anzeige = zielAnzeigeEl();
      var wr = work.getBoundingClientRect();
      var r = zone.zielPane.getBoundingClientRect();

      var links = r.left - wr.left + work.scrollLeft;
      var oben = r.top - wr.top;
      var breite = r.width;
      var hoehe = r.height;

      if (zone.richtung === 'links' || zone.richtung === 'rechts') {
        breite = r.width / 2;
        if (zone.richtung === 'rechts') { links += r.width / 2; }
      } else {
        hoehe = r.height / 2;
        if (zone.richtung === 'unten') { oben += r.height / 2; }
      }

      anzeige.style.left = links + 'px';
      anzeige.style.top = oben + 'px';
      anzeige.style.width = Math.max(24, breite) + 'px';
      anzeige.style.height = Math.max(24, hoehe) + 'px';
      anzeige.classList.add('sichtbar');
      letzteZone = zone;
    }

    function initAndocken() {
      var work = workEl();
      var plus = document.getElementById('neuesFenster');

      plus.addEventListener('click', function() {
        fuegePaneHinzu(null, null, null);
      });

      plus.addEventListener('dragstart', function(event) {
        ziehtNeuesFenster = true;
        ziehendesPane = null;
        event.dataTransfer.effectAllowed = 'copy';
        event.dataTransfer.setData('text/plain', 'neu');
      });

      plus.addEventListener('dragend', function() {
        ziehtNeuesFenster = false;
        versteckeZielAnzeige();
      });

      /* Fensterleisten sind Ziehpunkte fuers Umsortieren. */
      work.addEventListener('dragstart', function(event) {
        var leiste = event.target.closest
          ? event.target.closest('.panebar')
          : null;
        if (!leiste) { return; }

        /* Auswahlliste und Knoepfe bleiben bedienbar - von dort aus
           wird kein Fenster gezogen. */
        if (event.target.closest('select, button')) {
          event.preventDefault();
          return;
        }

        ziehendesPane = leiste.closest('.pane');
        ziehtNeuesFenster = false;
        ziehendesPane.classList.add('wirdGezogen');
        event.dataTransfer.effectAllowed = 'move';
        event.dataTransfer.setData('text/plain', 'pane');
      });

      work.addEventListener('dragend', function() {
        if (ziehendesPane) { ziehendesPane.classList.remove('wirdGezogen'); }
        ziehendesPane = null;
        versteckeZielAnzeige();
      });

      work.addEventListener('dragover', function(event) {
        if (!ziehtNeuesFenster && !ziehendesPane) { return; }
        if (ziehtNeuesFenster &&
            work.querySelectorAll('.pane').length >= MAX_PANES) { return; }

        event.preventDefault();
        event.dataTransfer.dropEffect = ziehtNeuesFenster ? 'copy' : 'move';
        zeigeZone(zoneBestimmen(event));
      });

      work.addEventListener('dragleave', function(event) {
        if (!work.contains(event.relatedTarget)) { versteckeZielAnzeige(); }
      });

      work.addEventListener('drop', function(event) {
        event.preventDefault();

        var zone = letzteZone || zoneBestimmen(event);
        versteckeZielAnzeige();

        if (ziehtNeuesFenster) {
          ziehtNeuesFenster = false;
          fuegePaneHinzu(null,
            zone ? zone.zielPane : null,
            zone ? zone.richtung : null);
          return;
        }

        if (ziehendesPane && zone) {
          var quelle = ziehendesPane;
          quelle.classList.remove('wirdGezogen');
          ziehendesPane = null;
          verschiebePane(quelle, zone.zielPane, zone.richtung);
        }
      });
    }

    /* ===== VERSCHIEBBARE FENSTERGROESSEN ===== */

    var aktivesResizeStoppen_ = null;

    function beendeAktivesResize_(layoutNochSpeichern) {
      if (aktivesResizeStoppen_) {
        aktivesResizeStoppen_(layoutNochSpeichern !== false);
        return;
      }

      document.body.classList.remove('resizing');
      document.body.classList.remove('resizingRow');
    }

    function initResizers() {
      var resizers = document.querySelectorAll('#work .resizer, #work .rowresizer');
      resizers.forEach(function(resizer) {
        resizer.addEventListener('pointerdown', startResize);
      });
    }

    function startResize(event) {
      if (event.button !== 0) { return; }
      event.preventDefault();

      /* Falls ein vorheriger Pointer-Vorgang ausserhalb des Fensters endete,
         zuerst dessen globale Cursor- und Listener-Zustaende aufraeumen. */
      beendeAktivesResize_(false);

      var resizer = event.currentTarget;

      /* Zwei Arten von Trennleisten:
           .resizer     zwischen Spalten, waagerecht
           .rowresizer  zwischen Fenstern einer Spalte, senkrecht
         Die Nachbarn ergeben sich aus der Position im DOM. */
      var istReihe = resizer.classList.contains('rowresizer');
      var erwarteteKlasse = istReihe ? 'pane' : 'spalte';

      var firstPane = resizer.previousElementSibling;
      var secondPane = resizer.nextElementSibling;

      if (!firstPane || !secondPane) { return; }
      if (!firstPane.classList.contains(erwarteteKlasse)) { return; }
      if (!secondPane.classList.contains(erwarteteKlasse)) { return; }

      var vertical = istReihe ||
        (!istReihe && window.matchMedia('(max-width: 800px)').matches);

      var firstRect = firstPane.getBoundingClientRect();
      var secondRect = secondPane.getBoundingClientRect();

      var startPosition = vertical ? event.clientY : event.clientX;
      var firstStartSize = vertical ? firstRect.height : firstRect.width;
      var secondStartSize = vertical ? secondRect.height : secondRect.width;
      var combinedSize = firstStartSize + secondStartSize;

      var minimumSize = 70;

      if (combinedSize < minimumSize * 2) {
        minimumSize = Math.max(30, combinedSize / 4);
      }

      firstPane.style.flex = '0 0 auto';
      secondPane.style.flex = '0 0 auto';

      if (vertical) {
        firstPane.style.height = firstStartSize + 'px';
        secondPane.style.height = secondStartSize + 'px';
      } else {
        firstPane.style.width = firstStartSize + 'px';
        secondPane.style.width = secondStartSize + 'px';
      }

      document.body.classList.add(vertical ? 'resizingRow' : 'resizing');
      resizer.classList.add('dragging');

      try {
        resizer.setPointerCapture(event.pointerId);
      } catch (e) {}

      function moveResize(moveEvent) {
        var currentPosition = vertical ? moveEvent.clientY : moveEvent.clientX;
        var difference = currentPosition - startPosition;

        var firstNewSize = firstStartSize + difference;
        var secondNewSize = secondStartSize - difference;

        if (firstNewSize < minimumSize) {
          firstNewSize = minimumSize;
          secondNewSize = combinedSize - minimumSize;
        }

        if (secondNewSize < minimumSize) {
          secondNewSize = minimumSize;
          firstNewSize = combinedSize - minimumSize;
        }

        if (vertical) {
          firstPane.style.height = firstNewSize + 'px';
          secondPane.style.height = secondNewSize + 'px';
        } else {
          firstPane.style.width = firstNewSize + 'px';
          secondPane.style.width = secondNewSize + 'px';
        }
      }

      var beendet = false;

      function stopResize(layoutNochSpeichern) {
        if (beendet) { return; }
        beendet = true;

        if (aktivesResizeStoppen_ === stopResize) {
          aktivesResizeStoppen_ = null;
        }

        try {
          if (resizer.hasPointerCapture(event.pointerId)) {
            resizer.releasePointerCapture(event.pointerId);
          }
        } catch (e) {}

        document.body.classList.remove('resizing');
        document.body.classList.remove('resizingRow');
        resizer.classList.remove('dragging');

        document.removeEventListener('pointermove', moveResize);
        window.removeEventListener('pointerup', stopResize, true);
        window.removeEventListener('pointercancel', stopResize, true);
        window.removeEventListener('blur', stopResize);
        resizer.removeEventListener('lostpointercapture', stopResize);

        if (layoutNochSpeichern !== false) {
          registriereAktivitaet();
        }
      }

      aktivesResizeStoppen_ = stopResize;
      document.addEventListener('pointermove', moveResize);
      window.addEventListener('pointerup', stopResize, true);
      window.addEventListener('pointercancel', stopResize, true);
      window.addEventListener('blur', stopResize);
      resizer.addEventListener('lostpointercapture', stopResize);
    }

    /* ===== START ===== */

    window.addEventListener('DOMContentLoaded', function() {
      /*
       * Jeder Schritt einzeln. Faellt einer aus, laufen die anderen
       * trotzdem - und die Anmeldung erscheint in jedem Fall.
       */
      [['Layout lesen', layoutBeimStartLesen_],
       ['Layoutauswahl', renderLayoutAuswahl_],
       ['Layoutmenü', initLayoutMenu_],
       ['Anwendungen', initAnwendungen_],
       ['Ausblenden', initVerbergen_],
       ['Not-Aus', initNotaus_],
       ['Fenstermenü', initFenster_],
       ['Briefmeldung', initBrief_],
       ['Fällig-Box', initFaellig_],
       ['Verlorene Fäden', initFaeden_],
       ['Einklappen', initKlappen_],
       ['Universalfeld', initUniversal_],
       ['Kacheln', renderTiles],
       ['Werkzeuge', renderUtilityTiles],
       ['Andocken', initAndocken],
       ['Startansicht', showStart]
      ].forEach(function(schritt) {
        try {
          schritt[1]();
        } catch (fehler) {
          zeigeStartfehler(schritt[0] + ' — ' + (fehler && fehler.message));
        }
      });

      /* Kein Wiedereinstieg. Jedes Oeffnen beginnt mit der
         Anmeldung - auch das Neuladen derselben Seite. */
      document.getElementById('cockpit').style.display = 'none';
      document.getElementById('login').style.display = 'flex';

      setTimeout(function() {
        document.getElementById('passwort').focus();
      }, 100);
    });
  </script>
