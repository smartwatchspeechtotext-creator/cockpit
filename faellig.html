<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">

  <!--
    HÜLLE FÜR DAS COCKPIT
    =====================
    Diese Seite tut fast nichts: Sie zeigt das Cockpit im Vollbild.

    Warum es sie braucht: Android erkennt eine App nur auf der
    obersten Ebene einer Seite. Apps Script liefert seine Oberfläche
    aber immer innerhalb einer Google-Seite aus - deshalb bietet
    Chrome dort kein "Installieren" an, egal was wir tun.

    Liegt diese Datei auf einer eigenen Adresse, ist sie die oberste
    Ebene. Chrome bietet dann "App installieren", startet ohne jede
    Browserleiste und legt sie in den App-Umschalter.

    Die Cockpit-Adresse wird beim ersten Start abgefragt und auf dem
    Gerät gemerkt. So muss an dieser Datei nichts bearbeitet werden -
    das ist auf einem Telefon der unangenehmste Teil.
  -->

  <title>Fällig</title>


  <!-- Verbindung zu Google schon aufbauen, bevor der Rahmen sie
       braucht. Namensauflösung und Verschlüsselung kosten am Handy
       oft ein paar hundert Millisekunden - die sind damit erledigt,
       während die Hülle noch aufbaut. -->
  <link rel="preconnect" href="https://script.google.com" crossorigin>
  <link rel="preconnect" href="https://script.googleusercontent.com" crossorigin>
  <link rel="dns-prefetch" href="https://script.google.com">
  <link rel="dns-prefetch" href="https://script.googleusercontent.com">

  <meta name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover,
             interactive-widget=resizes-content">

  <meta name="theme-color" content="#16181c">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Fällig">

  <link rel="manifest" href="faellig.webmanifest">
  <link rel="icon" href="faellig-192.png">
  <link rel="apple-touch-icon" href="faellig-192.png">

  <style>
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: #16181c;
      overscroll-behavior: none;
      -webkit-tap-highlight-color: transparent;
      font-family: "Segoe UI", Roboto, Arial, sans-serif;
    }

    iframe {
      display: block;
      width: 100%;
      height: 100%;
      border: 0;
      background: #f4f6f9;
    }

    /* Ladeschirm - dunkel, nicht weiß. Ein weißer Blitz beim Start
       sieht nach Webseite aus. */
    #warten {
      position: fixed;
      inset: 0;
      z-index: 10;
      display: grid;
      place-items: center;
      background: #16181c;
      transition: opacity .35s ease;
    }

    #warten.weg {
      opacity: 0;
      pointer-events: none;
      visibility: hidden;
    }

    #warten svg {
      width: 42px; height: 42px;
      fill: none; stroke: #fff;
      stroke-width: 1.7; stroke-linecap: round;
      opacity: .9;
    }

    /* Einmalige Abfrage der Adresse. */
    #einrichten {
      position: fixed;
      inset: 0;
      z-index: 20;
      display: none;
      place-items: center;
      padding: 24px;
      background: #16181c;
    }

    #einrichten.an { display: grid; }

    .karte { width: 100%; max-width: 380px; }

    .karte h1 {
      margin: 0 0 6px;
      font-size: 17px;
      font-weight: 600;
      color: #fff;
    }

    .karte p {
      margin: 0 0 16px;
      font-size: 13px;
      line-height: 1.55;
      color: #9aa0a8;
    }

    .karte input {
      width: 100%;
      padding: 13px 14px;
      font-family: inherit;
      font-size: 16px;
      color: #fff;
      background: #22252b;
      border: 1px solid #33373e;
      border-radius: 11px;
      outline: none;
    }

    .karte input:focus { border-color: #4f74c8; }
    .karte input + input { margin-top: 9px; }

    .karte input.verdeckt {
      -webkit-text-security: disc;
      text-security: disc;
      letter-spacing: .12em;
    }

    .karte button {
      width: 100%;
      margin-top: 10px;
      padding: 13px;
      font-family: inherit;
      font-size: 14px;
      font-weight: 600;
      color: #fff;
      background: #2864f0;
      border: 0;
      border-radius: 11px;
      cursor: pointer;
    }

    /* Bist du in Chrome mit mehreren Google-Konten angemeldet,
       muss der Browser raten, welches gemeint ist - und rät falsch.
       Die Ziffer in der Adresse nagelt es fest. */
    .kontoZeile {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-top: 12px;
      font-size: 12px;
      color: #9aa0a8;
    }

    .kontoZeile span { flex: 1; }

    .kontoKnopf {
      width: auto;
      min-width: 30px;
      margin: 0;
      padding: 7px 9px;
      font-family: inherit;
      font-size: 12px;
      font-weight: 600;
      color: #cdd2d8;
      background: #22252b;
      border: 1px solid #33373e;
      border-radius: 8px;
      cursor: pointer;
    }

    .kontoKnopf.aktiv {
      color: #fff;
      background: #2864f0;
      border-color: #2864f0;
    }

    .karte .fehler {
      min-height: 18px;
      margin-top: 9px;
      font-size: 12px;
      color: #e8908a;
    }

    /* Die rechte untere Ecke bleibt frei - dort liegen im Cockpit
       zwei Knöpfe, und die dürfen nicht verdeckt werden. */
    #lage {
      position: fixed;
      left: 0;
      right: 96px;
      bottom: 0;
      z-index: 30;
      padding: 7px 12px calc(7px + env(safe-area-inset-bottom));
      font-size: 11px;
      text-align: center;
      color: #8d939b;
      background: rgba(22, 24, 28, .92);
      border-top-right-radius: 10px;
      transition: opacity .4s ease;
      pointer-events: none;
    }

    #lage.weg { opacity: 0; }

    /* Die Einstellungen sind über die Statuszeile erreichbar, die
       beim Start kurz erscheint. Vorher lag hier ein unsichtbarer
       Griff in der unteren Ecke - der hat Klicks abgefangen, die
       dem Cockpit galten. */
    #lage.tippbar {
      pointer-events: auto;
      cursor: pointer;
      text-decoration: underline;
      text-underline-offset: 3px;
    }
    /* Der Notausgang - vorhanden, aber nicht laut. */
    #frisch {
      margin-top: 8px;
      background: none;
      border: 1px solid rgba(255, 255, 255, .16);
      color: rgba(255, 255, 255, .55);
      font-size: 12px;
      font-weight: 500;
    }

    #frisch:active { color: #fff; }
  </style>
</head>

<body>
  <div id="warten">
    <svg viewBox="0 0 24 24" aria-hidden="true">
      <path d="M6 8.5h12M6 12h8.2M6 15.5h5.2"/>
      <circle cx="17.2" cy="15.5" r="1.4" fill="#fff" stroke="none"/>
    </svg>
  </div>

  <!-- Sagt beim Start, was gerade passiert. Verschwindet nach ein
       paar Sekunden von selbst. -->
  <div id="lage"></div>

  <div id="einrichten">
    <div class="karte">
      <h1>Fällig-Ansicht</h1>
      <p>Beides bleibt auf diesem Gerät. Lädt die Seite nur im
         Privatmodus, hilft eine andere Kontonummer unten —
         der Reihe nach ausprobieren.</p>

      <input id="adresse" type="url" inputmode="url"
        autocomplete="off" autocapitalize="off" spellcheck="false"
        placeholder="https://script.google.com/macros/s/…/exec">

      <!-- Bewusst KEIN type="password": Sonst bietet Samsung Pass
           an, es zu speichern - und meldet dann, dass es die Seite
           nicht kennt. Die Verdeckung macht das Stylesheet. -->
      <input id="kennwort" type="text" class="verdeckt"
        autocomplete="off" autocapitalize="off" spellcheck="false"
        name="cockpit-geraet"
        placeholder="Kennwort Cockpit">

      <input id="kennwortWerkzeug" type="text" class="verdeckt"
        autocomplete="off" autocapitalize="off" spellcheck="false"
        name="werkzeug-geraet"
        placeholder="Kennwort Fallnummern">

      <input id="kennwortSchlaf" type="text" class="verdeckt"
        autocomplete="off" autocapitalize="off" spellcheck="false"
        name="schlaf-geraet"
        placeholder="Kennwort Schlafmedizin">

      <div class="kontoZeile">
        <span>Google-Konto</span>
        <button type="button" data-konto="" class="kontoKnopf">ohne</button>
        <button type="button" data-konto="0" class="kontoKnopf">0</button>
        <button type="button" data-konto="1" class="kontoKnopf">1</button>
        <button type="button" data-konto="2" class="kontoKnopf">2</button>
        <button type="button" data-konto="3" class="kontoKnopf">3</button>
      </div>

      <button id="speichern" type="button">Öffnen</button>

      <!-- Notausgang. Bleibt das Telefon in einer alten Fassung
           hängen, räumt das hier alles weg: den Speicher der Hülle
           und den Hintergrunddienst selbst. Danach lädt die Seite
           frisch von GitHub.

           Kennwörter und Adresse bleiben - die liegen woanders. -->
      <button id="frisch" type="button" class="leise">
        Zwischenspeicher leeren und neu laden
      </button>

      <div class="fehler" id="fehler"></div>
    </div>
  </div>

  <iframe id="cockpit"
    allow="clipboard-write; clipboard-read; microphone"
    referrerpolicy="no-referrer-when-downgrade"></iframe>


  <script>
    var ORT = 'cockpit_adresse';
    var ORT_KENNWORT = 'cockpit_kennwort';
    var ORT_KENNWORT_WERKZEUG = 'cockpit_kennwort_werkzeug';
    var ORT_KENNWORT_SCHLAF = 'cockpit_kennwort_schlaf';

    /* Wird bei jedem Start zurückgesetzt - siehe starte(). */
    var schonGeantwortet = false;

    /* Schon eingetragen - die Abfrage erscheint also gar nicht erst.
       Sie bleibt nur für den Fall bestehen, dass sich die Adresse
       einmal ändert: unten rechts in die Ecke tippen. */
    var VORGABE = 'https://script.google.com/macros/s/AKfycbxlv9Nk-4y4aV-41Lsizlhe39v4xErBMtKbFtDx9XE41WVPmI_GRuShr75-JfM-ozGu/exec';

    function gemerkt() {
      try { return localStorage.getItem(ORT) || ''; }
      catch (ignoriert) { return ''; }
    }

    function merken(wert) {
      try { localStorage.setItem(ORT, wert); }
      catch (ignoriert) {}
    }

    function kennwortGemerkt() {
      try { return localStorage.getItem(ORT_KENNWORT) || ''; }
      catch (ignoriert) { return ''; }
    }

    function kennwortMerken(wert) {
      try {
        if (wert) { localStorage.setItem(ORT_KENNWORT, wert); }
        else { localStorage.removeItem(ORT_KENNWORT); }
      } catch (ignoriert) {}
    }

    /* Fallnummern und die anderen Werkzeuge haben eigene
       Anmeldungen - und oft ein anderes Kennwort. */
    function werkzeugKennwortGemerkt() {
      try { return localStorage.getItem(ORT_KENNWORT_WERKZEUG) || ''; }
      catch (ignoriert) { return ''; }
    }

    function werkzeugKennwortMerken(wert) {
      try {
        if (wert) { localStorage.setItem(ORT_KENNWORT_WERKZEUG, wert); }
        else { localStorage.removeItem(ORT_KENNWORT_WERKZEUG); }
      } catch (ignoriert) {}
    }

    /* Der Schlafmedizin-Brief hat eine eigene Anmeldung mit einem
       dritten Kennwort. */
    function schlafKennwortGemerkt() {
      try { return localStorage.getItem(ORT_KENNWORT_SCHLAF) || ''; }
      catch (ignoriert) { return ''; }
    }

    function schlafKennwortMerken(wert) {
      try {
        if (wert) { localStorage.setItem(ORT_KENNWORT_SCHLAF, wert); }
        else { localStorage.removeItem(ORT_KENNWORT_SCHLAF); }
      } catch (ignoriert) {}
    }

    /*
     * Setzt oder entfernt die Kontonummer in der Adresse.
     *
     *   ohne:  https://script.google.com/macros/s/…/exec
     *   0:     https://script.google.com/u/0/macros/s/…/exec
     *
     * Welche Ziffer passt, haengt davon ab, an wievielter Stelle das
     * Konto angemeldet ist, dem das Skript gehoert. Ausprobieren ist
     * schneller als nachschlagen - deshalb die Knoepfe.
     */
    function mitKonto(adresse, nummer) {
      var ohne = String(adresse || '')
        .replace(/(script\.google\.com)\/u\/\d+\//, '$1/');

      if (nummer === '' || nummer === null) { return ohne; }

      return ohne.replace(/(script\.google\.com)\//, '$1/u/' + nummer + '/');
    }

    function kontoAus(adresse) {
      var g = String(adresse || '').match(/script\.google\.com\/u\/(\d+)\//);
      return g ? g[1] : '';
    }

    function zeigeKonto(nummer) {
      var knoepfe = document.querySelectorAll('.kontoKnopf');
      for (var i = 0; i < knoepfe.length; i++) {
        knoepfe[i].classList.toggle('aktiv',
          knoepfe[i].dataset.konto === String(nummer));
      }
    }

    function sage(text) {
      var el = document.getElementById('lage');
      if (!el) { return; }

      el.textContent = text + '   ·   Einstellungen';
      el.classList.remove('weg');
      el.classList.add('tippbar');

      clearTimeout(sage.uhr);
      sage.uhr = window.setTimeout(function () {
        el.classList.add('weg');
        el.classList.remove('tippbar');
      }, 8000);
    }

    /* Die letzten Zeichen der Bereitstellungs-Kennung - genug, um
       zwei Geräte zu vergleichen, zu wenig, um etwas zu verraten. */
    var kennungJetzt = '';

    function merkeKennung(adresse) {
      var g = String(adresse || '').match(/\/macros\/s\/([^/]+)\//);
      kennungJetzt = g ? '…' + g[1].slice(-6) : '?';
    }

    function starte(adresse) {
      document.getElementById('einrichten').classList.remove('an');

      /* Für einen neuen Versuch wieder freigeben - sonst bliebe es
         beim zweiten Anlauf stumm. */
      schonGeantwortet = false;

      /*
       * Die Kennwörter gehen in der Adresse mit - derselbe Weg wie
       * bei der Vorauswahl in Rp. und OPs. Der Nachrichtenaustausch
       * zwischen den Rahmen bleibt zusätzlich bestehen, falls die
       * Adresse einmal nicht durchkommt.
       */
      var wort = kennwortGemerkt();
      var ziel = adresse;

      /*
       * Kennung der Bereitstellung anzeigen.
       *
       * Genau daran hing die Suche: Auf dem Telefon stand eine
       * andere Fassung als im Browser - und man sah es nirgends.
       * Die letzten Zeichen der Adresse reichen zum Vergleichen und
       * verraten nichts; die Kennwörter bleiben ohnehin draußen.
       */
      merkeKennung(adresse);

      if (wort) {
        var trenner = ziel.indexOf('?') === -1 ? '?' : '&';

        ziel += trenner + 'k=' + encodeURIComponent(wort) +
                '&kw=' + encodeURIComponent(werkzeugKennwortGemerkt() || wort) +
                '&ks=' + encodeURIComponent(schlafKennwortGemerkt() || '') +
                '&nur=faellig';

        sage('Kennwörter hinterlegt · melde an …');
      } else {
        ziel += (ziel.indexOf('?') === -1 ? '?' : '&') + 'nur=faellig';
        sage('Kein Kennwort hinterlegt · Anmeldung wie gewohnt');
      }

      document.getElementById('cockpit').src = ziel;
    }

    function frage() {
      document.getElementById('einrichten').classList.add('an');
      document.getElementById('warten').classList.add('weg');
      var adresseJetzt = gemerkt() || VORGABE;
      document.getElementById('adresse').value = adresseJetzt;
      document.getElementById('kennwort').value = kennwortGemerkt();
      document.getElementById('kennwortWerkzeug').value =
        werkzeugKennwortGemerkt();
      document.getElementById('kennwortSchlaf').value =
        schlafKennwortGemerkt();
      zeigeKonto(kontoAus(adresseJetzt));
    }

    document.getElementById('cockpit').addEventListener('load', function () {
      document.getElementById('warten').classList.add('weg');

      /* Kurz zeigen, WELCHE Bereitstellung geladen wurde. Steht auf
         zwei Geräten Verschiedenes, ist die Ursache damit gefunden,
         ohne dass man erst die Einstellungen öffnen muss. */
      sage('Cockpit ' + kennungJetzt);
    });

    /*
     * Das Cockpit meldet sich, sobald es bereit ist - wir antworten
     * mit dem Kennwort.
     *
     * Diese Richtung ist nötig, weil Apps Script die Seite in einem
     * verschachtelten Rahmen ausliefert: Wir kämen von uns aus nur
     * bei Googles Wrapper an, nicht beim Cockpit selbst. Auf eine
     * eingehende Nachricht dürfen wir dagegen direkt antworten.
     */


    window.addEventListener('message', function (ev) {
      var d = ev && ev.data;
      if (!d || d.typ !== 'cockpit-bereit') { return; }

      var wort = kennwortGemerkt();

      if (!wort) { sage('Cockpit gemeldet · kein Kennwort hinterlegt'); return; }
      if (!ev.source) { sage('Cockpit gemeldet · kein Rückweg'); return; }

      /* Das Cockpit meldet sich mehrmals, falls die erste Meldung
         zu früh kam. Antworten genügt einmal - sonst liefen mehrere
         Anmeldungen gleichzeitig. */
      if (schonGeantwortet) { return; }
      schonGeantwortet = true;

      try {
        ev.source.postMessage({
          typ: 'cockpit-anmeldung',
          passwort: wort,
          /* Das Cockpit gibt es an die Werkzeuge weiter. Ist keines
             hinterlegt, nimmt es sein eigenes. */
          werkzeugPasswort: werkzeugKennwortGemerkt() || wort,
          schlafPasswort: schlafKennwortGemerkt() || ''
        }, '*');

        sage('Cockpit gemeldet · Kennwort gesendet');
      } catch (ignoriert) {
        sage('Cockpit gemeldet · Senden fehlgeschlagen');
      }
    });

    /* Notbremse: ein dauerhafter Ladeschirm wäre schlimmer als ein
       zu früh weggeblendeter. */
    window.setTimeout(function () {
      document.getElementById('warten').classList.add('weg');
    }, 6000);

    document.getElementById('speichern').addEventListener('click', function () {
      var wert = document.getElementById('adresse').value.trim();
      var fehler = document.getElementById('fehler');

      if (wert.indexOf('https://') !== 0) {
        fehler.textContent = 'Die Adresse muss mit https:// beginnen.';
        return;
      }

      if (wert.indexOf('/exec') === -1) {
        fehler.textContent = 'Die Adresse sollte auf /exec enden.';
        return;
      }

      fehler.textContent = '';
      merken(wert);
      kennwortMerken(document.getElementById('kennwort').value);
      werkzeugKennwortMerken(
        document.getElementById('kennwortWerkzeug').value);
      schlafKennwortMerken(
        document.getElementById('kennwortSchlaf').value);
      starte(wert);
    });

    document.getElementById('adresse').addEventListener('keydown', function (e) {
      if (e.key === 'Enter') { document.getElementById('speichern').click(); }
    });

    /* Kontoknöpfe schreiben die Adresse um - sofort sichtbar. */
    var knoepfe = document.querySelectorAll('.kontoKnopf');

    for (var i = 0; i < knoepfe.length; i++) {
      knoepfe[i].addEventListener('click', function () {
        var feld = document.getElementById('adresse');
        feld.value = mitKonto(feld.value, this.dataset.konto);
        zeigeKonto(this.dataset.konto);
      });
    }

    /* Die Statuszeile beim Start ist der Weg in die Einstellungen.
       Sie liegt nur wenige Sekunden über dem Bild und verschwindet
       dann samt ihrer Klickfläche. */
    document.getElementById('lage').addEventListener('click', frage);

    /*
     * Notausgang: Speicher der Hülle weg, Hintergrunddienst weg,
     * dann frisch laden.
     *
     * Das Cockpit liegt nicht im Speicher - hier verschwindet also
     * nur die Hülle. Adresse und Kennwörter bleiben, die stehen im
     * localStorage und werden nicht angefasst.
     */
    document.getElementById('frisch').addEventListener('click', function () {
      var knopf = document.getElementById('frisch');
      knopf.disabled = true;
      knopf.textContent = 'Räume auf …';

      var schritte = [];

      try {
        if (window.caches && caches.keys) {
          schritte.push(caches.keys().then(function (namen) {
            return Promise.all(namen.map(function (n) { return caches.delete(n); }));
          }));
        }
      } catch (ignoriert) {}

      try {
        if (navigator.serviceWorker && navigator.serviceWorker.getRegistrations) {
          schritte.push(
            navigator.serviceWorker.getRegistrations().then(function (liste) {
              return Promise.all(liste.map(function (r) { return r.unregister(); }));
            })
          );
        }
      } catch (ignoriert) {}

      Promise.all(schritte).catch(function () {}).then(function () {
        /* Mit Zeitstempel, damit auch der Browser-Zwischenspeicher
           nicht die alte Seite herausgibt. */
        var ziel = location.pathname + '?frisch=' + Date.now();
        location.replace(ziel);
      });
    });

    var adresse = gemerkt() || VORGABE;

    if (adresse) { starte(adresse); } else { frage(); }

    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function () {
        navigator.serviceWorker.register('sw.js').catch(function () {});
      });
    }
  </script>
</body>
</html>
